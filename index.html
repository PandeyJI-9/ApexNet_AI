<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ApexNet | Restricted Neural Terminal</title>
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { apexDark: '#070a10', apexCard: '#0f141f', apexHover: '#171e2e', apexAccent: '#2563eb' } } } }</script>
    <script src="[https://cdn.jsdelivr.net/npm/marked/marked.min.js](https://cdn.jsdelivr.net/npm/marked/marked.min.js)"></script>
    <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css](https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css)">
    <script src="[https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js](https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js)"></script>
    <script src="[https://unpkg.com/@phosphor-icons/web](https://unpkg.com/@phosphor-icons/web)"></script>
    <style>
        body { background-color: #070a10; color: #f3f4f6; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; height: 100dvh; display: flex; overflow: hidden; background-image: radial-gradient(circle at 50% 0%, #1e3a8a15 0%, transparent 70%); }
        ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        .prose pre { background: #030508 !important; border: 1px solid #1f2937; border-radius: 0.75rem; padding: 1rem; margin-top: 0.75rem; overflow-x: auto; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
        .prose code { font-family: 'Fira Code', monospace; font-size: 0.85rem; color: #60a5fa; }
        .prose p { margin-bottom: 0.85rem; line-height: 1.6; } textarea { resize: none; overflow-y: hidden; } textarea:focus { outline: none; }
        @keyframes apexGlow { 0% { opacity: 0.4; text-shadow: 0 0 10px #3b82f6; } 50% { opacity: 1; text-shadow: 0 0 25px #60a5fa; } 100% { opacity: 0.4; text-shadow: 0 0 10px #3b82f6; } }
        .apex-glow { animation: apexGlow 2.5s infinite ease-in-out; }
        .matrix-bg { background-image: linear-gradient(rgba(11, 15, 25, 0.9), rgba(11, 15, 25, 0.9)), url('[https://www.transparenttextures.com/patterns/cubes.png](https://www.transparenttextures.com/patterns/cubes.png)'); }
    </style>
</head>
<body class="matrix-bg text-gray-100 flex h-[100dvh] w-full selection:bg-blue-600/30 relative">

    <div id="authModal" class="fixed inset-0 bg-black/90 backdrop-blur-xl z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-apexCard border border-blue-500/20 w-full max-w-md rounded-2xl p-8 shadow-[0_0_50px_-12px_rgba(37,99,235,0.25)] space-y-6 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-blue-500 to-transparent opacity-50"></div>
            <div class="text-center">
                <div class="inline-flex p-3 bg-blue-900/20 rounded-xl text-blue-500 mb-4"><i class="ph ph-fingerprint text-4xl"></i></div>
                <h2 class="text-2xl font-extrabold tracking-tight text-white">Classified Access</h2>
            </div>
            <div class="flex bg-[#070a10] p-1 rounded-lg border border-white/5 text-xs font-semibold uppercase">
                <button onclick="switchTab('login')" id="tabLogin" class="flex-1 py-2.5 rounded-md bg-blue-600 text-white transition-all shadow-md">Login</button>
                <button onclick="switchTab('signup')" id="tabSignup" class="flex-1 py-2.5 rounded-md text-gray-500 hover:text-white transition-all">Request Access</button>
            </div>
            <div class="space-y-4">
                <div><label class="text-xs text-gray-400 block mb-1 uppercase">Identity String</label><input type="text" id="authUsername" class="w-full bg-[#070a10] border border-white/10 rounded-lg px-4 py-3 text-sm text-blue-100 focus:outline-none focus:border-blue-500"></div>
                <div><label class="text-xs text-gray-400 block mb-1 uppercase">Security Cipher</label><input type="password" id="authPassword" class="w-full bg-[#070a10] border border-white/10 rounded-lg px-4 py-3 text-sm text-blue-100 focus:outline-none focus:border-blue-500"></div>
                <div id="signupKeyBox" class="hidden"><label class="text-xs text-gray-400 block mb-1 uppercase">Clearance Key</label><input type="text" id="authKey" class="w-full bg-[#070a10] border border-white/10 rounded-lg px-4 py-3 text-sm text-blue-100 focus:outline-none focus:border-blue-500"></div>
                <p id="authError" class="text-xs text-red-500 text-center hidden font-bold bg-red-500/10 py-2 rounded-md border border-red-500/20"></p>
                <button onclick="handleAuthSubmit()" id="authSubmitBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold tracking-widest uppercase py-3 rounded-lg text-xs">Establish Connection</button>
                <button onclick="document.getElementById('manualUrlBox').classList.toggle('hidden')" class="text-[10px] text-gray-500 hover:text-white mt-4 underline decoration-dashed w-full text-center tracking-wider uppercase">Manual Override</button>
                <div id="manualUrlBox" class="mt-2 pt-4 border-t border-white/10 hidden">
                    <input type="text" id="manualUrl" placeholder="https://..." class="w-full bg-[#070a10] border border-white/10 rounded-lg px-3 py-2 text-xs text-blue-100 mb-2">
                    <button onclick="setManualUrl()" class="w-full bg-gray-800 text-white font-bold uppercase py-2 rounded-lg text-[10px]">Force Connect</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ⚙️ SETTINGS MODAL (Voice + Speed) -->
    <div id="settingsModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-apexCard border border-white/10 w-full max-w-sm rounded-xl p-6 shadow-2xl relative">
            <button onclick="toggleSettings()" class="absolute top-4 right-4 text-gray-400 hover:text-white"><i class="ph ph-x text-xl"></i></button>
            <h2 class="text-lg font-bold tracking-widest uppercase text-blue-400 mb-6 flex items-center gap-2"><i class="ph ph-sliders"></i> Neural Settings</h2>
            
            <div class="space-y-4">
                <label class="text-xs text-gray-400 font-semibold uppercase block">Select AI Identity (Hindi/Eng)</label>
                <label class="flex items-center gap-3 p-3 bg-[#070a10] border border-white/5 rounded-lg cursor-pointer">
                    <input type="radio" name="voice_select" value="hi-IN-MadhurNeural" checked class="text-blue-500 bg-gray-800 border-gray-600">
                    <div><div class="text-sm font-bold text-blue-400">Desi Hacker (Pro)</div><div class="text-[10px] text-gray-500 uppercase">Hindi/English • Master AI</div></div>
                </label>
                <label class="flex items-center gap-3 p-3 bg-[#070a10] border border-white/5 rounded-lg cursor-pointer">
                    <input type="radio" name="voice_select" value="en-US-AriaNeural" class="text-blue-500 bg-gray-800 border-gray-600">
                    <div><div class="text-sm font-bold text-gray-200">Sci-Fi Echo</div><div class="text-[10px] text-gray-500 uppercase">Crisp Female • English Only</div></div>
                </label>

                <!-- 🔥 NEW: SPEED CONTROL -->
                <label class="text-xs text-gray-400 font-semibold uppercase block mt-4">Speech Velocity</label>
                <select id="voiceSpeed" class="w-full bg-[#070a10] border border-white/10 rounded-lg px-3 py-2 text-sm text-blue-100 focus:outline-none">
                    <option value="+0%">Normal (1.0x)</option>
                    <option value="+20%">Fast (1.2x)</option>
                    <option value="+50%">Overdrive (1.5x)</option>
                </select>
                
                <button onclick="saveSettings()" class="w-full mt-4 bg-blue-600 text-white font-bold tracking-widest uppercase py-2.5 rounded-lg text-xs">Save & Deploy</button>
            </div>
        </div>
    </div>

    <aside class="w-[280px] bg-apexCard flex-shrink-0 flex flex-col hidden md:flex border-r border-white/5 shadow-2xl relative z-10">
        <div class="p-4 border-b border-white/5"><button onclick="createNewChat()" class="w-full flex items-center justify-center gap-3 px-4 py-3 rounded-xl bg-blue-600/10 text-sm font-bold text-blue-400"><i class="ph ph-plus-circle text-lg"></i> Initialize Protocol</button></div>
        <div class="flex-1 overflow-y-auto px-3 py-2 space-y-1" id="historyList"></div>
        <div class="p-4 border-t border-white/5 flex flex-col gap-2 text-xs bg-[#070a10]/50">
            <div class="flex items-center justify-between text-gray-400">
                <div class="flex items-center gap-2"><div id="statusDot" class="w-2 h-2 rounded-full bg-yellow-500"></div><span id="serverStatus">Syncing...</span></div>
                <div class="flex gap-3 text-base">
                    <button onclick="toggleSettings()" class="hover:text-blue-400"><i class="ph ph-gear-six"></i></button>
                    <button onclick="logout()" class="hover:text-red-500"><i class="ph ph-power"></i></button>
                </div>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full w-full overflow-hidden relative">
        <header class="md:hidden flex items-center justify-between p-4 border-b border-white/5 bg-apexCard text-white shadow-md">
            <button onclick="document.querySelector('aside').classList.toggle('hidden')"><i class="ph ph-list text-2xl text-blue-400"></i></button>
            <h1 class="font-bold text-xs tracking-widest uppercase flex items-center gap-2"><i class="ph ph-cpu text-blue-500"></i> ApexNet Core</h1>
            <div class="flex items-center gap-4"><i class="ph ph-gear-six text-lg text-gray-400" onclick="toggleSettings()"></i><i class="ph ph-plus-circle text-xl text-blue-400" onclick="createNewChat()"></i></div>
        </header>
        <div id="chatBox" class="flex-1 overflow-y-auto p-4 md:p-8 w-full max-w-5xl mx-auto flex flex-col gap-6 scroll-smooth"></div>

        <div class="flex-shrink-0 w-full bg-gradient-to-t from-[#070a10] via-[#070a10] to-transparent pb-6 pt-4 px-4 md:px-8">
            <div class="max-w-4xl mx-auto relative flex flex-col bg-apexHover border border-white/10 rounded-2xl overflow-hidden focus-within:border-blue-500/50">
                <div class="flex items-center gap-3 px-4 pt-3 pb-1">
                    <button id="deepThinkBtn" onclick="toggleDeepThink()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold uppercase tracking-widest border border-white/10 text-gray-400 bg-black/20 hover:bg-black/40">
                        <i class="ph ph-brain text-sm"></i> <span id="deepThinkText">Google Core: OFF</span>
                    </button>
                    <div id="deepThinkIndicator" class="hidden h-1.5 w-1.5 rounded-full bg-blue-500 animate-pulse"></div>
                </div>
                <div class="relative flex items-end p-1.5 w-full">
                    <textarea id="userInput" rows="1" class="w-full max-h-[200px] bg-transparent py-2.5 pl-3 pr-14 text-sm md:text-base text-gray-100 placeholder-gray-500" placeholder="Execute command or ask for code..."></textarea>
                    <button id="sendBtn" onclick="handleSend()" class="absolute right-3 bottom-3 p-2.5 bg-blue-600 text-white rounded-xl"><i class="ph ph-paper-plane-tilt text-xl"></i></button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const GIST_URL = "[https://gist.githubusercontent.com/PandeyJI-9/6b0c7fa3c4ed32c7d6da9681876fb80f/raw/colab_link.txt](https://gist.githubusercontent.com/PandeyJI-9/6b0c7fa3c4ed32c7d6da9681876fb80f/raw/colab_link.txt)";
        let COLAB_URL = "";
        let AUTH_TOKEN = localStorage.getItem('apex_token') || "";
        let APEX_VOICE = localStorage.getItem('apex_voice') || "hi-IN-MadhurNeural";
        let APEX_SPEED = localStorage.getItem('apex_speed') || "+0%";
        
        let currentMode = 'login';
        let currentChatId = null;
        let chats = [];
        let isGenerating = false; 
        let isDeepThinkEnabled = false;

        // 🔥 BUG FIX: Global Audio Manager (No more overlapping DJs!)
        let currentGlobalAudio = null;
        let currentActivePlayBtn = null;
        let currentActivePlayBtnHtml = "";

        document.querySelector(`input[value="${APEX_VOICE}"]`).checked = true;
        document.getElementById("voiceSpeed").value = APEX_SPEED;

        function toggleSettings() { document.getElementById('settingsModal').classList.toggle('hidden'); }
        function saveSettings() {
            APEX_VOICE = document.querySelector('input[name="voice_select"]:checked').value;
            APEX_SPEED = document.getElementById("voiceSpeed").value;
            localStorage.setItem('apex_voice', APEX_VOICE);
            localStorage.setItem('apex_speed', APEX_SPEED);
            toggleSettings();
        }

        async function playAudio(streamId, btnElement) {
            const rawDataElem = document.getElementById('raw_' + streamId);
            if (!rawDataElem) return;
            // Decode URI to get pure Raw Markdown for strict Code skip filtering
            const textToSpeak = decodeURIComponent(rawDataElem.innerText);
            
            // 🛑 STOP PREVIOUS AUDIO IF PLAYING
            if (currentGlobalAudio) {
                currentGlobalAudio.pause();
                currentGlobalAudio = null;
                if (currentActivePlayBtn) {
                    currentActivePlayBtn.innerHTML = currentActivePlayBtnHtml;
                    currentActivePlayBtn.disabled = false;
                    currentActivePlayBtn.classList.replace('text-green-400', 'text-blue-400');
                    currentActivePlayBtn.classList.replace('border-green-500/50', 'border-blue-500/30');
                }
            }

            currentActivePlayBtnHtml = btnElement.innerHTML;
            currentActivePlayBtn = btnElement;

            btnElement.innerHTML = `<i class="ph ph-spinner animate-spin text-sm"></i> Streaming...`;
            btnElement.disabled = true;

            try {
                const res = await fetch(`${COLAB_URL}/v1/audio`, {
                    method: 'POST',
                    headers: secureHeaders(),
                    body: JSON.stringify({ text: textToSpeak, voice: APEX_VOICE, speed: APEX_SPEED })
                });

                if (!res.ok) throw new Error("Audio stream failed");
                
                const blob = await res.blob();
                const audioUrl = URL.createObjectURL(blob);
                currentGlobalAudio = new Audio(audioUrl);
                
                currentGlobalAudio.onplay = () => {
                    btnElement.innerHTML = `<i class="ph ph-waveform animate-pulse text-sm"></i> Live Audio`;
                    btnElement.classList.replace('text-blue-400', 'text-green-400');
                    btnElement.classList.replace('border-blue-500/30', 'border-green-500/50');
                };
                
                currentGlobalAudio.onended = () => {
                    btnElement.innerHTML = currentActivePlayBtnHtml;
                    btnElement.disabled = false;
                    btnElement.classList.replace('text-green-400', 'text-blue-400');
                    btnElement.classList.replace('border-green-500/50', 'border-blue-500/30');
                    currentGlobalAudio = null;
                };
                
                await currentGlobalAudio.play();
            } catch (err) {
                btnElement.innerHTML = `<i class="ph ph-warning-circle text-sm text-red-400"></i> Error`;
                setTimeout(() => { btnElement.innerHTML = currentActivePlayBtnHtml; btnElement.disabled = false; }, 2000);
            }
        }

        function setManualUrl() {
            const mUrl = document.getElementById('manualUrl').value.trim();
            if (mUrl.startsWith("http")) {
                COLAB_URL = mUrl.replace(/\/$/, "");
                document.getElementById('serverStatus').innerText = 'Cluster Active (Manual)';
                document.getElementById('manualUrlBox').classList.add('hidden');
                document.getElementById('authError').innerText = "System Overridden. Proceed to Auth.";
                document.getElementById('authError').classList.remove('hidden');
            }
        }

        function toggleDeepThink() {
            isDeepThinkEnabled = !isDeepThinkEnabled;
            const btn = document.getElementById('deepThinkBtn');
            const text = document.getElementById('deepThinkText');
            if (isDeepThinkEnabled) {
                btn.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold border border-blue-500/50 text-blue-400 bg-blue-900/20";
                text.innerText = "Google Core: ON"; document.getElementById('deepThinkIndicator').classList.remove('hidden');
            } else {
                btn.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold border border-white/10 text-gray-400 bg-black/20";
                text.innerText = "Google Core: OFF"; document.getElementById('deepThinkIndicator').classList.add('hidden');
            }
        }

        const secureHeaders = (isAuth = true) => {
            const h = { 'Content-Type': 'application/json', 'Bypass-Tunnel-Reminder': 'true' };
            if (isAuth && AUTH_TOKEN) h['Authorization'] = `Bearer ${AUTH_TOKEN}`;
            return h;
        };

        const renderWelcomeScreen = () => {
            return `<div class="h-full flex flex-col items-center justify-center text-center px-4" id="welcomeScreen">
                <div class="w-24 h-24 bg-blue-900/20 border border-blue-500/30 rounded-full flex items-center justify-center mb-6 apex-glow relative">
                    <i class="ph ph-cpu text-5xl text-blue-400"></i></div>
                <h2 class="text-4xl font-black mb-3 bg-gradient-to-br from-white via-blue-200 to-blue-600 bg-clip-text text-transparent uppercase">Terminal Access Granted</h2>
                <div class="flex gap-2 mb-4"><span class="px-3 py-1 text-[10px] font-bold text-blue-400 bg-blue-900/30 border border-blue-500/20 rounded-md">God-Mode</span>
                <span class="px-3 py-1 text-[10px] font-bold text-purple-400 bg-purple-900/30 border border-purple-500/20 rounded-md">Live Voice Stream</span></div>
            </div>`;
        };

        async function initSystem() {
            document.getElementById('chatBox').innerHTML = renderWelcomeScreen(); 
            try {
                const linkRes = await fetch(`${GIST_URL}?t=${new Date().getTime()}`);
                if (!linkRes.ok) throw new Error("Gist Fetch Blocked");
                COLAB_URL = (await linkRes.text()).trim().replace(/\/$/, "");
                document.getElementById('serverStatus').innerText = 'Cluster Active';
                if (!AUTH_TOKEN) document.getElementById('authModal').classList.remove('hidden'); else await fetchCloudChats();
            } catch (err) {
                document.getElementById('serverStatus').innerText = 'Cluster Offline';
                document.getElementById('statusDot').className = 'w-2 h-2 rounded-full bg-red-500';
                document.getElementById('authModal').classList.remove('hidden');
            }
        }

        async function fetchCloudChats() {
            try {
                const res = await fetch(`${COLAB_URL}/v1/chats`, { headers: secureHeaders() });
                if (res.ok) {
                    const data = await res.json(); chats = data.chats || []; verifyToken();
                    if (chats.length > 0) loadChat(chats[0].id); else createNewChat();
                } else logout();
            } catch (e) { document.getElementById('authModal').classList.remove('hidden'); }
        }

        async function saveCloudChat(chat) { try { await fetch(`${COLAB_URL}/v1/chats/save`, { method: 'POST', headers: secureHeaders(), body: JSON.stringify(chat) }); } catch (e) {} }

        function switchTab(mode) {
            currentMode = mode;
            document.getElementById('tabLogin').className = mode === 'login' ? "flex-1 py-2.5 rounded-md bg-blue-600 text-white" : "flex-1 py-2.5 rounded-md text-gray-500 hover:text-white";
            document.getElementById('tabSignup').className = mode === 'signup' ? "flex-1 py-2.5 rounded-md bg-blue-600 text-white" : "flex-1 py-2.5 rounded-md text-gray-500 hover:text-white";
            document.getElementById('signupKeyBox').classList.toggle('hidden', mode === 'login');
            document.getElementById('authSubmitBtn').innerText = mode === 'login' ? "Establish Connection" : "Verify Clearance";
        }

        async function handleAuthSubmit() {
            const username = document.getElementById('authUsername').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            const key = document.getElementById('authKey').value.trim();
            const errBox = document.getElementById('authError');
            if (!username || !password) return;

            try {
                let endpoint = currentMode === 'login' ? '/v1/auth/login' : '/v1/auth/signup';
                let payload = currentMode === 'login' ? { username, password } : { username, password, activation_key: key };
                const res = await fetch(`${COLAB_URL}${endpoint}`, { method: 'POST', headers: secureHeaders(false), body: JSON.stringify(payload) });

                if (res.ok) {
                    AUTH_TOKEN = (await res.json()).token; localStorage.setItem('apex_token', AUTH_TOKEN);
                    document.getElementById('authModal').classList.add('hidden'); errBox.classList.add('hidden');
                    await fetchCloudChats();
                } else {
                    const errData = await res.json();
                    errBox.innerText = `Access Denied: ${res.status === 404 && currentMode === 'login' ? "Database Wiped on Colab restart! Use 'Request Access'." : errData.detail}`;
                    errBox.classList.remove('hidden');
                }
            } catch (err) { errBox.innerText = "Connection Failed."; errBox.classList.remove('hidden'); }
        }

        function verifyToken() { document.getElementById('authModal').classList.add('hidden'); }
        function logout() { localStorage.removeItem('apex_token'); AUTH_TOKEN = ""; document.getElementById('authModal').classList.remove('hidden'); }
        
        async function createNewChat() {
            if (isGenerating) return; 
            currentChatId = 'chat_' + Date.now();
            const newChat = { id: currentChatId, title: "Classified Intel", messages: [] };
            chats.unshift(newChat); renderHistory(); document.getElementById('chatBox').innerHTML = renderWelcomeScreen(); await saveCloudChat(newChat);
        }

        function loadChat(id) {
            if (isGenerating) return; 
            currentChatId = id; document.getElementById('chatBox').innerHTML = ''; 
            const chat = chats.find(c => c.id === id);
            if (chat && chat.messages.length > 0) { chat.messages.forEach(msg => appendMessageUI(msg.role, msg.content, true)); } 
            else { document.getElementById('chatBox').innerHTML = renderWelcomeScreen(); }
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('historyList'); list.innerHTML = '';
            chats.forEach(chat => {
                const isActive = chat.id === currentChatId;
                list.innerHTML += `<button onclick="loadChat('${chat.id}')" class="w-full text-left flex items-center gap-3 px-3 py-3 rounded-xl ${isActive ? 'bg-blue-600/10 border border-blue-500/30 text-blue-100 font-semibold shadow-inner' : 'text-gray-400 hover:bg-apexHover border border-transparent'} transition-all text-sm truncate"><i class="ph ph-terminal-window text-base text-blue-500"></i><span class="truncate tracking-wide">${chat.title}</span></button>`;
            });
        }

        function appendMessageUI(role, text, isHistoryLoad = false) {
            const chatBox = document.getElementById('chatBox');
            if (document.getElementById('welcomeScreen')) document.getElementById('welcomeScreen').remove();

            const isUser = role === 'user';
            const msgRow = document.createElement('div');
            msgRow.className = `w-full flex my-4 px-2 md:px-4 ${isUser ? 'justify-end' : 'justify-start'}`;
            const uniqueId = 'msg_' + Date.now() + Math.random().toString(36).substring(7);

            if (isUser) {
                msgRow.innerHTML = `<div class="max-w-[85%] md:max-w-[70%] bg-blue-600 text-white px-5 py-4 rounded-2xl rounded-tr-sm text-sm md:text-base">${text}</div>`;
            } else {
                msgRow.innerHTML = `
                    <div class="max-w-[95%] md:max-w-[85%] flex gap-4 items-start bg-apexHover border border-white/5 px-5 md:px-6 py-5 rounded-2xl rounded-tl-sm text-sm md:text-base text-gray-200">
                        <div class="w-9 h-9 rounded-xl bg-blue-900/30 border border-blue-500/40 flex-shrink-0 flex items-center justify-center text-blue-400 mt-0.5"><i class="ph ph-cpu text-xl"></i></div>
                        <div class="w-full">
                            <div class="hidden" id="raw_${uniqueId}">${encodeURIComponent(text)}</div>
                            <div class="prose prose-invert max-w-none w-full overflow-x-auto leading-loose">${marked.parse(text)}</div>
                            ${isHistoryLoad ? `<div class="mt-3 flex items-center justify-end border-t border-white/5 pt-2"><button onclick="playAudio('${uniqueId}', this)" class="text-[10px] text-blue-400 hover:text-blue-300 flex items-center gap-1.5 bg-blue-900/20 px-2.5 py-1.5 rounded-md border border-blue-500/30 uppercase font-bold"><i class="ph ph-speaker-high text-sm"></i> Play Voice</button></div>` : ''}
                        </div>
                    </div>`;
            }
            chatBox.appendChild(msgRow); document.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el)); chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function handleSend() {
            if (isGenerating) return; 
            const input = document.getElementById('userInput'); const text = input.value.trim();
            if (!text) return; if (!AUTH_TOKEN) { document.getElementById('authModal').classList.remove('hidden'); return; }

            isGenerating = true; 
            if (!currentChatId) await createNewChat();
            appendMessageUI('user', text); input.value = ''; input.style.height = 'auto';

            const chat = chats.find(c => c.id === currentChatId);
            if (chat.messages.length === 0) chat.title = text.substring(0, 25) + "...";
            chat.messages.push({ role: 'user', content: text }); await saveCloudChat(chat); renderHistory();

            const chatBox = document.getElementById('chatBox');
            if (document.getElementById('welcomeScreen')) document.getElementById('welcomeScreen').remove();

            const uniqueStreamId = 'stream_' + Date.now();
            const aiRow = document.createElement('div'); aiRow.className = `w-full flex my-4 px-2 md:px-4 justify-start`;
            const iconHTML = isDeepThinkEnabled ? '<i class="ph ph-brain text-xl text-purple-400 animate-pulse"></i>' : '<i class="ph ph-cpu text-xl text-blue-400"></i>';
            const bgClass = isDeepThinkEnabled ? 'bg-purple-900/30 border-purple-500/40' : 'bg-blue-900/30 border-blue-500/40';

            aiRow.innerHTML = `
                <div class="max-w-[95%] md:max-w-[85%] flex gap-4 items-start bg-apexHover border border-blue-500/20 px-5 md:px-6 py-5 rounded-2xl rounded-tl-sm text-sm md:text-base text-gray-200 w-full relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-1 h-full bg-blue-500"></div>
                    <div class="w-9 h-9 rounded-xl ${bgClass} border flex-shrink-0 flex items-center justify-center mt-0.5 apex-glow">${iconHTML}</div>
                    <div class="w-full">
                        <div id="status_${uniqueStreamId}" class="text-xs font-mono font-bold text-blue-400 mb-2 animate-pulse hidden tracking-wide"></div>
                        <div class="hidden" id="raw_${uniqueStreamId}"></div>
                        <div class="prose prose-invert max-w-none w-full overflow-x-auto leading-loose" id="${uniqueStreamId}"><span class="inline-block w-2.5 h-4 bg-blue-400 animate-pulse ml-1 align-middle"></span></div>
                        <div id="audiobar_${uniqueStreamId}" class="hidden mt-3 flex items-center justify-end border-t border-white/5 pt-2">
                            <button onclick="playAudio('${uniqueStreamId}', this)" class="text-[10px] text-blue-400 hover:text-blue-300 flex items-center gap-1.5 bg-blue-900/20 px-2.5 py-1.5 rounded-md border border-blue-500/30 uppercase font-bold"><i class="ph ph-speaker-high text-sm"></i> Play Voice</button>
                        </div>
                    </div>
                </div>`;
            chatBox.appendChild(aiRow); chatBox.scrollTop = chatBox.scrollHeight;

            const contentElem = document.getElementById(uniqueStreamId);
            const statusElem = document.getElementById(`status_${uniqueStreamId}`);
            const rawElem = document.getElementById(`raw_${uniqueStreamId}`);
            let fullReply = "";

            try {
                const response = await fetch(`${COLAB_URL}/v1/chat`, { method: 'POST', headers: secureHeaders(), body: JSON.stringify({ id: chat.id, title: chat.title, messages: chat.messages, client: "web", deep_think: isDeepThinkEnabled }) });
                if (!response.ok) throw new Error("Stream failed");

                const reader = response.body.getReader(); const decoder = new TextDecoder();
                while (true) {
                    const { value, done } = await reader.read(); if (done) break;
                    const lines = decoder.decode(value, { stream: true }).split("\n");

                    for (let line of lines) {
                        if (line.startsWith("data: ")) {
                            const dataStr = line.replace("data: ", "").trim(); if (dataStr === "[DONE]") break;
                            try {
                                const parsed = JSON.parse(dataStr);
                                if (parsed.status) {
                                    if (parsed.status === "DONE") statusElem.classList.add('hidden'); 
                                    else { statusElem.classList.remove('hidden'); statusElem.innerText = parsed.status; chatBox.scrollTop = chatBox.scrollHeight; }
                                }
                                if (parsed.content) {
                                    fullReply += parsed.content;
                                    rawElem.innerText = encodeURIComponent(fullReply);
                                    contentElem.innerHTML = marked.parse(fullReply) + '<span class="inline-block w-2.5 h-4 bg-blue-400 animate-pulse ml-1 align-middle"></span>';
                                    chatBox.scrollTop = chatBox.scrollHeight;
                                }
                            } catch (e) {}
                        }
                    }
                }
                contentElem.innerHTML = marked.parse(fullReply); document.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
                chat.messages.push({ role: 'assistant', content: fullReply }); await saveCloudChat(chat);
                document.getElementById(`audiobar_${uniqueStreamId}`).classList.remove('hidden');

            } catch (err) { contentElem.innerHTML = "<span class='text-red-400 font-bold'>🚨 Connection Severed.</span>"; } 
            finally {
                isGenerating = false; aiRow.firstElementChild.classList.remove('border-blue-500/20'); aiRow.firstElementChild.classList.add('border-white/5');
                aiRow.firstElementChild.querySelector('.absolute').remove(); statusElem.classList.add('hidden'); 
            }
        }

        const input = document.getElementById('userInput'); input.addEventListener('input', function() { this.style.height = 'auto'; this.style.height = this.scrollHeight + 'px'; });
        input.addEventListener('keydown', function(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!isGenerating) handleSend(); } });

        if (chats.length === 0) initSystem(); else renderHistory(); initSystem();
    </script>
</body>
</html>
