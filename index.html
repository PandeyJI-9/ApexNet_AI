<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexNet | Secure AI Intelligence</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <!-- PrismJS for Code Highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
    <!-- MathJax Config (Skipping code blocks to prevent bugs) -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\(', '\)']] },
            options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 h-screen flex flex-col font-sans select-none sm:select-auto">

    <!-- TOP HEADER BAR -->
    <header class="bg-gray-900 border-b border-gray-800 p-3 px-4 flex flex-col sm:flex-row justify-between items-center gap-3 shadow-md z-10">
        <div class="flex items-center space-x-3 w-full sm:w-auto justify-between sm:justify-start">
            <div class="flex items-center space-x-2">
                <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse shadow-[0_0_8px_rgba(34,197,94,0.6)]"></div>
                <h1 class="text-lg font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500">ApexNet 💀</h1>
            </div>
            <span id="userBadge" class="hidden sm:inline-block text-xs bg-gray-800 text-blue-400 px-2.5 py-1 rounded-md font-mono border border-gray-700">Not Logged In</span>
        </div>

        <!-- SERVER URL CONFIGURATION -->
        <div class="flex items-center space-x-2 w-full sm:w-auto">
            <span class="text-xs text-gray-400 font-mono hidden md:inline">Backend URL:</span>
            <input type="text" id="serverUrl" placeholder="https://xxx.trycloudflare.com" 
                class="bg-gray-950 text-green-400 text-xs px-3 py-1.5 rounded-lg border border-gray-700 focus:outline-none focus:border-blue-500 w-full sm:w-64 font-mono shadow-inner"
                onchange="saveServerUrl(this.value)">
            <button onclick="testConnection()" title="Test Connection" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-lg text-xs font-mono border border-gray-700 transition">Ping</button>
        </div>
    </header>

    <!-- AUTH VIEW (LOGIN / SIGNUP) -->
    <div id="authContainer" class="flex-1 flex items-center justify-center p-4 bg-gray-950">
        <div class="bg-gray-900 border border-gray-800 p-6 sm:p-8 rounded-2xl w-full max-w-md shadow-2xl space-y-6">
            <div class="text-center space-y-1">
                <h2 class="text-2xl font-black text-white tracking-wide">Terminal Access</h2>
                <p class="text-xs text-gray-400 font-mono">Secure Multi-User Auth Portal</p>
            </div>

            <!-- Tabs -->
            <div class="flex bg-gray-950 p-1 rounded-xl border border-gray-800">
                <button onclick="switchTab('login')" id="tabLogin" class="flex-1 py-2 text-xs font-bold rounded-lg bg-blue-600 text-white transition shadow">Login</button>
                <button onclick="switchTab('signup')" id="tabSignup" class="flex-1 py-2 text-xs font-bold rounded-lg text-gray-400 hover:text-white transition">Sign Up</button>
            </div>

            <!-- Form -->
            <form id="authForm" onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-mono text-gray-400 mb-1">USERNAME</label>
                    <input type="text" id="username" required placeholder="gamerbgmi1234" 
                        class="w-full bg-gray-950 text-white text-sm px-3.5 py-2.5 rounded-xl border border-gray-800 focus:outline-none focus:border-blue-500 font-mono">
                </div>

                <div>
                    <label class="block text-xs font-mono text-gray-400 mb-1">PASSWORD</label>
                    <input type="password" id="password" required placeholder="••••••••" 
                        class="w-full bg-gray-950 text-white text-sm px-3.5 py-2.5 rounded-xl border border-gray-800 focus:outline-none focus:border-blue-500 font-mono">
                </div>

                <div id="keyGroup" class="hidden space-y-1">
                    <label class="block text-xs font-mono text-blue-400 mb-1">ACTIVATION KEY (1-Time Use)</label>
                    <input type="text" id="activationKey" placeholder="APEX-BETA-XXXX" 
                        class="w-full bg-gray-950 text-green-400 text-sm px-3.5 py-2.5 rounded-xl border border-blue-900/50 focus:outline-none focus:border-blue-500 font-mono uppercase">
                </div>

                <div id="authError" class="text-xs text-red-400 font-mono text-center hidden"></div>

                <button type="submit" id="authSubmitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl font-bold transition shadow-lg text-sm">
                    Authenticate Session
                </button>
            </form>
        </div>
    </div>

    <!-- CHAT VIEW (HIDDEN INITIALLY) -->
    <div id="chatContainer" class="hidden flex-1 flex flex-col overflow-hidden relative">
        
        <!-- Chat Area -->
        <main id="chatBox" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-6 pb-24 max-w-4xl w-full mx-auto"></main>

        <!-- Floating Controls / Logout -->
        <div class="absolute top-4 right-4 z-20">
            <button onclick="logout()" class="bg-gray-900/80 hover:bg-red-950/80 text-gray-300 hover:text-red-400 px-3 py-1.5 rounded-lg text-xs font-mono border border-gray-700 backdrop-blur transition shadow">
                Logout [x]
            </button>
        </div>

        <!-- Input Footer -->
        <footer class="bg-gray-900/90 backdrop-blur border-t border-gray-800 p-3 sm:p-4">
            <div class="flex max-w-4xl mx-auto space-x-2 sm:space-x-3 items-end">
                <textarea id="userInput" rows="1" placeholder="Type prompt or command..." 
                    class="flex-1 bg-gray-950 text-white p-3 rounded-xl focus:outline-none focus:ring-1 focus:ring-blue-500 resize-none font-mono text-sm max-h-32 border border-gray-800"
                    oninput="autoResize(this)"></textarea>
                <button onclick="sendMessage()" id="sendBtn" class="bg-blue-600 hover:bg-blue-700 px-5 py-3 rounded-xl font-bold transition shadow-[0_0_15px_rgba(37,99,235,0.4)] flex items-center justify-center">
                    <svg class="w-5 h-5 text-white transform rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                </button>
            </div>
        </footer>
    </div>

    <script>
        // --- CORE CLIENT STATE ---
        let currentMode = 'login'; // login or signup
        let wakeLock = null;

        window.onload = () => {
            // Load saved server URL
            const savedUrl = localStorage.getItem('apex_server_url');
            if (savedUrl) document.getElementById('serverUrl').value = savedUrl;

            // Check session
            const token = localStorage.getItem('apex_token');
            const username = localStorage.getItem('apex_username');
            if (token && username) {
                showChatInterface(username);
            }

            // Request Screen Wake Lock (Bug 8 Fix)
            requestWakeLock();
        };

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.log(`Wake Lock error: ${err.name}, ${err.message}`);
            }
        }

        function saveServerUrl(url) {
            localStorage.setItem('apex_server_url', url.trim().replace(/\/$/, ""));
        }

        function getServerUrl() {
            let url = document.getElementById('serverUrl').value.trim().replace(/\/$/, "");
            if (!url) {
                alert("Bhai pehle header mein Colab ka Cloudflare URL daal! 🤦‍♂️");
                throw new Error("URL missing");
            }
            return url;
        }

        // --- AUTH TABS & LOGIC ---
        function switchTab(mode) {
            currentMode = mode;
            const btnLogin = document.getElementById('tabLogin');
            const btnSignup = document.getElementById('tabSignup');
            const keyGroup = document.getElementById('keyGroup');
            const submitBtn = document.getElementById('authSubmitBtn');
            const errDiv = document.getElementById('authError');
            errDiv.classList.add('hidden');

            if (mode === 'login') {
                btnLogin.className = "flex-1 py-2 text-xs font-bold rounded-lg bg-blue-600 text-white transition shadow";
                btnSignup.className = "flex-1 py-2 text-xs font-bold rounded-lg text-gray-400 hover:text-white transition";
                keyGroup.classList.add('hidden');
                submitBtn.innerText = "Authenticate Session";
            } else {
                btnSignup.className = "flex-1 py-2 text-xs font-bold rounded-lg bg-blue-600 text-white transition shadow";
                btnLogin.className = "flex-1 py-2 text-xs font-bold rounded-lg text-gray-400 hover:text-white transition";
                keyGroup.classList.remove('hidden');
                submitBtn.innerText = "Initialize Account";
            }
        }

        async function handleAuth(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const key = document.getElementById('activationKey').value.trim();
            const errDiv = document.getElementById('authError');
            const submitBtn = document.getElementById('authSubmitBtn');

            errDiv.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerText = "Processing...";

            try {
                const base = getServerUrl();
                const endpoint = currentMode === 'login' ? `${base}/v1/auth/login` : `${base}/v1/auth/signup`;
                
                const payload = currentMode === 'login' 
                    ? { username, password } 
                    : { username, password, activation_key: key };

                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || "Authentication failed");

                // Save session in localStorage (Bug 12 & 16 Fix)
                localStorage.setItem('apex_token', data.token);
                localStorage.setItem('apex_username', username);

                showChatInterface(username);
            } catch (err) {
                errDiv.innerText = `❌ Error: ${err.message}`;
                errDiv.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = currentMode === 'login' ? "Authenticate Session" : "Initialize Account";
            }
        }

        function showChatInterface(username) {
            document.getElementById('authContainer').classList.add('hidden');
            document.getElementById('chatContainer').classList.remove('hidden');
            document.getElementById('userBadge').innerText = `Admin: ${username}`;
            loadLocalChatHistory();
        }

        function logout() {
            localStorage.removeItem('apex_token');
            localStorage.removeItem('apex_username');
            document.getElementById('chatContainer').classList.add('hidden');
            document.getElementById('authContainer').classList.remove('hidden');
            document.getElementById('chatBox').innerHTML = '';
        }

        async function testConnection() {
            try {
                const base = getServerUrl();
                const res = await fetch(`${base}/ping`);
                if (res.ok) alert("🟢 Connection Successful! Colab server is live.");
                else alert("⚠️ Server responded with an error.");
            } catch (e) {
                alert("❌ Connection Failed. Check if Colab tunnel is running.");
            }
        }

        // --- CHAT & RENDERING ENGINE ---
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
        }

        document.getElementById('userInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const msg = input.value.trim();
            if (!msg) return;

            const token = localStorage.getItem('apex_token');
            if (!token) {
                logout();
                return;
            }

            appendMessage("Ayush", msg, "bg-blue-600 text-white self-end ml-auto rounded-br-none");
            input.value = "";
            input.style.height = 'auto';

            const loadingId = appendMessage("ApexNet", "Thinking...", "bg-gray-900 border border-gray-800 self-start mr-auto rounded-bl-none text-green-400 animate-pulse font-mono text-sm");

            try {
                const base = getServerUrl();
                const response = await fetch(`${base}/v1/chat`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ message: msg })
                });

                if (response.status === 401) {
                    alert("Session expired. Please log in again.");
                    logout();
                    return;
                }

                const data = await response.json();
                document.getElementById(loadingId).remove();

                let reply = data.reply || data.detail || "No response received.";
                
                // Filter out <think> tags for clean UI display (Bug Fix)
                reply = reply.replace(/<think>[\s\S]*?<\/think>/g, '').trim();
                if (!reply) reply = data.reply; // Fallback

                appendMessage("ApexNet", reply, "bg-gray-900 border border-gray-800 self-start mr-auto rounded-bl-none text-gray-200");
                saveChatHistory();
            } catch (err) {
                document.getElementById(loadingId).innerText = "❌ Network Error: Failed to fetch from Colab backend.";
                document.getElementById(loadingId).classList.remove('animate-pulse', 'text-green-400');
                document.getElementById(loadingId).classList.add('text-red-400');
            }
        }

        function appendMessage(sender, text, classes) {
            const chatBox = document.getElementById('chatBox');
            const div = document.createElement('div');
            const id = 'msg-' + Date.now() + Math.random();
            div.id = id;

            // Format code blocks (PrismJS)
            let formatted = text.replace(/```(\w*)\n([\s\S]*?)```/g, '<div class="my-3 rounded-xl overflow-hidden border border-gray-800 shadow-xl bg-gray-950"><div class="bg-gray-900 px-4 py-1.5 text-xs text-gray-400 font-mono border-b border-gray-800 flex justify-between items-center"><span>$1</span></div><pre class="p-4 m-0 overflow-x-auto text-xs font-mono"><code class="language-$1">$2</code></pre></div>');
            formatted = formatted.replace(/\n/g, "<br>");

            div.className = `p-4 rounded-2xl max-w-[90%] sm:max-w-[80%] shadow-md leading-relaxed ${classes}`;
            let icon = sender === "Ayush" ? "👤" : "🤖";
            div.innerHTML = `<div class="text-[10px] text-gray-400 mb-1.5 font-bold tracking-wider uppercase flex items-center gap-1.5"><span>${icon}</span> ${sender}</div><div class="text-sm">${formatted}</div>`;

            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;

            // Trigger Render Engines
            if (window.MathJax) MathJax.typesetPromise();
            Prism.highlightAll();

            return id;
        }

        function saveChatHistory() {
            const chatBox = document.getElementById('chatBox');
            // Keep last 30 messages in localStorage
            const messages = Array.from(chatBox.children).slice(-30).map(el => el.outerHTML);
            localStorage.setItem('apex_chat_history', JSON.stringify(messages));
        }

        function loadLocalChatHistory() {
            const saved = localStorage.getItem('apex_chat_history');
            if (saved) {
                try {
                    const messages = JSON.parse(saved);
                    const chatBox = document.getElementById('chatBox');
                    chatBox.innerHTML = messages.join('');
                    if (window.MathJax) MathJax.typesetPromise();
                    Prism.highlightAll();
                } catch(e) {}
            }
        }
    </script>
</body>
</html>
