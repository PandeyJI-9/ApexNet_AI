<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ApexNet v6.1 | Omni-Modal Core</title>
    
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { apexDark: '#070a10', apexCard: '#0f141f', apexHover: '#171e2e' } } } }
    </script>
    
    <!-- Cloud & Parser Implants -->
    <script src="https://js.puter.com/v2/"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- PDF.js Implant for reading PDFs locally -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    
    <style>
        body { background-color: #070a10; color: #f3f4f6; font-family: 'Inter', sans-serif; margin: 0; height: 100dvh; display: flex; overflow: hidden; }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: #374151; border-radius: 10px; }
        .prose pre { background: #030508 !important; border: 1px solid #1f2937; border-radius: 0.75rem; padding: 1rem; overflow-x: auto; }
        .matrix-bg { background-image: linear-gradient(rgba(11, 15, 25, 0.93), rgba(11, 15, 25, 0.93)), url('https://www.transparenttextures.com/patterns/cubes.png'); }
        textarea { resize: none; overflow-y: hidden; } textarea:focus { outline: none; }
        
        /* Deep Think Animation */
        details.think-block summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body class="matrix-bg flex h-[100dvh] w-full selection:bg-blue-600/30">

    <!-- Auth Modal -->
    <div id="authModal" class="fixed inset-0 bg-black/90 backdrop-blur-xl z-50 flex items-center justify-center p-4">
        <div class="bg-apexCard border border-blue-500/20 w-full max-w-sm rounded-2xl p-8 text-center shadow-[0_0_50px_-12px_rgba(37,99,235,0.25)]">
            <i class="ph ph-fingerprint text-6xl text-blue-500 mb-4 animate-pulse"></i>
            <h2 class="text-2xl font-extrabold text-white mb-2 tracking-tight">ApexNet v6.1</h2>
            <p class="text-xs text-gray-400 mb-8 uppercase tracking-widest">Omni-Modal Cloud Protocol</p>
            <button onclick="loginWithPuter()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold tracking-widest uppercase py-3.5 rounded-xl transition-all shadow-lg">Login to System</button>
        </div>
    </div>

    <!-- Sidebar -->
    <aside class="w-[280px] bg-apexCard flex-shrink-0 flex flex-col hidden md:flex border-r border-white/5 shadow-2xl">
        <div class="p-5 border-b border-white/5"><button onclick="createNewChat()" class="w-full flex items-center justify-center gap-3 px-4 py-3.5 rounded-xl bg-blue-600/10 text-sm font-bold text-blue-400 hover:bg-blue-600/20"><i class="ph ph-plus-circle text-lg"></i> New Terminal</button></div>
        <div class="flex-1 overflow-y-auto px-4 py-3 space-y-2" id="historyList"></div>
        <div class="p-5 border-t border-white/5 flex flex-col gap-3 text-xs bg-[#070a10]/80">
            <div class="flex items-center justify-between text-gray-400">
                <div class="flex items-center gap-2"><div id="statusDot" class="w-2 h-2 rounded-full bg-red-500"></div><span id="colabStatus">Colab Offline</span></div>
                <button onclick="logoutPuter()" class="hover:text-red-500"><i class="ph ph-power text-lg"></i></button>
            </div>
            <div class="text-[10px] text-blue-400 truncate" id="puterUserName">Agent: Unknown</div>
        </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="flex-1 flex flex-col h-full w-full overflow-hidden relative">
        <header class="md:hidden flex items-center justify-between p-4 border-b border-white/5 bg-apexCard text-white shadow-md">
            <button onclick="document.querySelector('aside').classList.toggle('hidden')"><i class="ph ph-list text-2xl text-blue-400"></i></button>
            <h1 class="font-bold text-xs tracking-widest uppercase text-blue-500">ApexNet 6.1</h1>
            <i class="ph ph-plus-circle text-2xl text-blue-400" onclick="createNewChat()"></i>
        </header>

        <div id="chatBox" class="flex-1 overflow-y-auto p-4 md:p-8 w-full max-w-5xl mx-auto flex flex-col gap-6 scroll-smooth"></div>

        <!-- Input Area -->
        <div class="flex-shrink-0 w-full bg-gradient-to-t from-[#070a10] via-[#070a10] to-transparent pb-6 pt-2 px-4 md:px-8 relative">
            <div class="max-w-4xl mx-auto">
                
                <!-- Attachment Preview Bubble -->
                <div id="attachmentPreview" class="hidden mb-2 inline-flex items-center gap-2 bg-blue-900/40 border border-blue-500/30 px-3 py-1.5 rounded-lg text-xs text-blue-200 shadow-lg">
                    <i id="attachIcon" class="ph ph-file-text"></i>
                    <span id="attachName" class="max-w-[150px] truncate">file.pdf</span>
                    <button onclick="clearAttachment()" class="text-red-400 hover:text-red-300 ml-2"><i class="ph ph-x-circle"></i></button>
                </div>

                <div class="flex flex-col bg-apexHover border border-white/10 rounded-2xl p-2 shadow-2xl focus-within:border-blue-500/50 transition-all">
                    <div class="flex items-center justify-between px-3 pt-2 pb-1 border-b border-white/5 mb-1">
                        <button id="ragBtn" onclick="toggleRAG()" class="text-[10px] font-bold uppercase tracking-widest bg-purple-900/30 text-purple-400 px-3 py-1 rounded-full"><i class="ph ph-books"></i> Omni-Vault: OFF</button>
                        <input type="text" id="manualColabUrl" placeholder="Colab URL..." class="bg-black/50 border border-white/10 rounded-md px-2 py-1 text-[10px] text-gray-300 w-32 focus:w-48 transition-all">
                    </div>
                    
                    <div class="relative flex items-end w-full">
                        <!-- Hidden File Input -->
                        <input type="file" id="fileUpload" class="hidden" accept="image/*,.pdf" onchange="handleFileSelect(event)">
                        <!-- Attach Button -->
                        <button onclick="document.getElementById('fileUpload').click()" class="p-3 text-gray-400 hover:text-blue-400 transition-all"><i class="ph ph-paperclip text-xl"></i></button>
                        
                        <textarea id="userInput" rows="1" class="w-full max-h-[150px] bg-transparent py-3 px-2 text-sm text-gray-100 placeholder-gray-500 focus:outline-none" placeholder="Execute command, /scan URL, or /imagine prompt..."></textarea>
                        
                        <button id="sendBtn" onclick="handleSend()" class="p-3 bg-blue-600 text-white rounded-xl shadow-[0_0_15px_rgba(37,99,235,0.4)] ml-2 mb-1 mr-1"><i class="ph ph-paper-plane-tilt text-lg font-bold"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Setup PDF.js Worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        let currentUser = null;
        let chats = [];
        let currentChatId = null;
        let isGenerating = false;
        let isRAGEnabled = false;
        
        // Attachment Data
        let currentAttachment = { type: null, data: null, name: null };

        // Puter Auth
        async function checkPuterStatus() {
            if (puter.auth.isSignedIn()) {
                currentUser = await puter.auth.getUser();
                document.getElementById('puterUserName').innerText = `Agent: ${currentUser.username}`;
                document.getElementById('authModal').classList.add('hidden');
                loadCloudData();
            }
        }
        async function loginWithPuter() { await puter.auth.signIn(); window.location.reload(); }
        async function logoutPuter() { await puter.auth.signOut(); window.location.reload(); }

        // Cloud DB
        async function loadCloudData() {
            const storedChats = await puter.kv.get("apex_chats");
            if (storedChats) chats = JSON.parse(storedChats);
            if (chats.length > 0) loadChat(chats[0].id); else createNewChat();
            renderHistory();
        }
        async function saveCloudData() { if (currentUser) await puter.kv.set("apex_chats", JSON.stringify(chats)); }

        // RAG Toggle
        function toggleRAG() {
            isRAGEnabled = !isRAGEnabled;
            const btn = document.getElementById('ragBtn');
            btn.innerHTML = isRAGEnabled ? '<i class="ph ph-books"></i> Omni-Vault: ON' : '<i class="ph ph-books"></i> Omni-Vault: OFF';
            btn.className = isRAGEnabled ? "text-[10px] font-bold uppercase tracking-widest bg-purple-900/50 text-purple-300 border border-purple-400 px-3 py-1 rounded-full shadow-[0_0_10px_rgba(168,85,247,0.4)]" : "text-[10px] font-bold uppercase tracking-widest bg-purple-900/30 text-purple-400 border border-transparent px-3 py-1 rounded-full";
        }

        // --- ATTACHMENT LOGIC (PDF & Image) ---
        async function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            document.getElementById('attachmentPreview').classList.remove('hidden');
            document.getElementById('attachName').innerText = "Processing...";
            
            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    currentAttachment = { type: 'image', data: e.target.result, name: file.name };
                    document.getElementById('attachIcon').className = "ph ph-image";
                    document.getElementById('attachName').innerText = file.name;
                };
                reader.readAsDataURL(file);
            } else if (file.type === 'application/pdf') {
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                    let text = `--- EXTRACTED PDF: ${file.name} ---\n`;
                    // Read first 10 pages to avoid memory crash
                    const maxPages = Math.min(pdf.numPages, 10); 
                    for (let i = 1; i <= maxPages; i++) {
                        const page = await pdf.getPage(i);
                        const content = await page.getTextContent();
                        text += content.items.map(item => item.str).join(' ') + "\n";
                    }
                    currentAttachment = { type: 'pdf', data: text, name: file.name };
                    document.getElementById('attachIcon').className = "ph ph-file-pdf";
                    document.getElementById('attachName').innerText = file.name;
                } catch (err) {
                    alert("PDF processing failed!");
                    clearAttachment();
                }
            } else {
                alert("Only Images and PDFs are supported right now!");
                clearAttachment();
            }
        }

        function clearAttachment() {
            currentAttachment = { type: null, data: null, name: null };
            document.getElementById('fileUpload').value = '';
            document.getElementById('attachmentPreview').classList.add('hidden');
        }

        // --- CHAT LOGIC ---
        async function createNewChat() {
            if (isGenerating) return;
            currentChatId = 'chat_' + Date.now();
            chats.unshift({ id: currentChatId, title: "New Intelligence", messages: [] });
            document.getElementById('chatBox').innerHTML = `<div class="h-full flex flex-col items-center justify-center opacity-50"><i class="ph ph-cpu text-6xl text-blue-500 mb-4"></i><h2 class="text-2xl font-bold uppercase tracking-widest">Omni-Core Ready</h2></div>`;
            renderHistory(); await saveCloudData();
        }

        function loadChat(id) {
            if (isGenerating) return;
            currentChatId = id;
            document.getElementById('chatBox').innerHTML = '';
            chats.find(c => c.id === id).messages.forEach(msg => appendMessageUI(msg.role, msg.content, msg.attachment));
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = '';
            chats.forEach(chat => {
                const isActive = chat.id === currentChatId;
                list.innerHTML += `<button onclick="loadChat('${chat.id}')" class="w-full text-left flex items-center gap-3 px-4 py-3 rounded-xl ${isActive ? 'bg-blue-600/20 text-blue-300 font-semibold' : 'text-gray-400 hover:bg-apexHover'} text-sm truncate"><i class="ph ph-terminal-window"></i><span class="truncate">${chat.title}</span></button>`;
            });
        }

        function appendMessageUI(role, text, attachmentData = null) {
            const chatBox = document.getElementById('chatBox');
            const msgRow = document.createElement('div');
            msgRow.className = `w-full flex my-4 px-2 ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            
            // Format DEEP THINKING tags to sexy UI
            let formattedText = text;
            formattedText = formattedText.replace(/<think>/g, '<details class="think-block mb-4 bg-black/40 border border-white/5 rounded-xl p-3"><summary class="cursor-pointer text-xs font-bold text-blue-400 flex items-center gap-2 select-none"><i class="ph ph-brain text-lg animate-pulse"></i> ApexNet Deep Thinking...</summary><div class="mt-3 text-xs text-gray-400 border-l-2 border-blue-500/30 pl-3">');
            formattedText = formattedText.replace(/<\/think>/g, '</div></details>');

            if (role === 'user') {
                let attachHtml = '';
                if (attachmentData && attachmentData.type === 'image') {
                    attachHtml = `<img src="${attachmentData.data}" class="w-48 rounded-lg mb-2 border border-blue-400/30">`;
                } else if (attachmentData && attachmentData.type === 'pdf') {
                    attachHtml = `<div class="bg-blue-900/50 p-2 rounded mb-2 text-xs border border-blue-400/30"><i class="ph ph-file-pdf"></i> ${attachmentData.name} attached</div>`;
                }
                msgRow.innerHTML = `<div class="max-w-[85%] bg-blue-600 text-white px-5 py-3 rounded-2xl rounded-tr-sm text-sm shadow-lg">${attachHtml}${formattedText}</div>`;
            } else {
                msgRow.innerHTML = `<div class="max-w-[95%] bg-apexHover border border-white/5 px-5 py-4 rounded-2xl rounded-tl-sm text-sm text-gray-200 shadow-xl prose prose-invert overflow-x-auto w-full">${marked.parse(formattedText)}</div>`;
            }
            chatBox.appendChild(msgRow);
            document.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        const inputElem = document.getElementById('userInput');
        inputElem.addEventListener('input', function() { this.style.height = 'auto'; this.style.height = this.scrollHeight + 'px'; });
        inputElem.addEventListener('keydown', function(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }});

        async function handleSend() {
            if (isGenerating) return;
            const text = inputElem.value.trim();
            const colabUrl = document.getElementById('manualColabUrl').value.trim().replace(/\/$/, "");
            
            if (!text && !currentAttachment.data) return;

            // 🎨 COMMAND INTERCEPT: /imagine
            if (text.startsWith("/imagine ")) {
                isGenerating = true;
                const prompt = text.replace("/imagine ", "");
                appendMessageUI('user', text);
                inputElem.value = '';
                const uniqueId = 'stream_' + Date.now();
                document.getElementById('chatBox').insertAdjacentHTML('beforeend', `<div class="w-full flex my-4 px-2 justify-start"><div class="bg-apexHover border border-blue-500/30 p-5 rounded-2xl"><div id="status_${uniqueId}" class="text-xs text-blue-400 animate-pulse"><i class="ph ph-palette"></i> Synthesizing Image via Puter AI...</div><div id="${uniqueId}"></div></div></div>`);
                
                try {
                    const imgElement = await puter.ai.txt2img(prompt);
                    document.getElementById(`status_${uniqueId}`).classList.add('hidden');
                    document.getElementById(uniqueId).appendChild(imgElement);
                    imgElement.className = "rounded-lg shadow-lg border border-white/10 max-w-full";
                    chats.find(c => c.id === currentChatId).messages.push({ role: 'user', content: text }, { role: 'assistant', content: `[Image Generated: ${prompt}]` });
                    await saveCloudData();
                } catch (e) {
                    document.getElementById(`status_${uniqueId}`).innerText = "❌ Image Generation Failed!";
                }
                isGenerating = false;
                clearAttachment();
                return;
            }

            if (!colabUrl) { alert("Please enter the Colab URL!"); return; }

            isGenerating = true;
            appendMessageUI('user', text, currentAttachment);
            inputElem.value = ''; inputElem.style.height = 'auto';

            const chat = chats.find(c => c.id === currentChatId);
            if (chat.messages.length === 0) chat.title = text.substring(0, 20) || currentAttachment.name;
            
            // Format Payload
            let finalPrompt = text;
            if (currentAttachment.type === 'pdf') {
                finalPrompt = `${text}\n\n${currentAttachment.data}`; 
            } else if (text.startsWith("/scan ")) {
                finalPrompt = `[SYSTEM_CMD: SCAN_URL] ${text.replace("/scan ", "")}`;
            }

            const payloadMessage = { role: 'user', content: finalPrompt };
            if (currentAttachment.type === 'image') payloadMessage.image_base64 = currentAttachment.data;
            
            chat.messages.push({ role: 'user', content: text, attachment: currentAttachment.type ? currentAttachment : null });
            
            // Temporary attachment reset for UI
            const attachmentToSend = currentAttachment;
            clearAttachment();

            const uniqueId = 'stream_' + Date.now();
            document.getElementById('chatBox').insertAdjacentHTML('beforeend', `<div class="w-full flex my-4 px-2 justify-start"><div class="w-full max-w-[95%] bg-apexHover border border-blue-500/30 px-5 py-4 rounded-2xl rounded-tl-sm text-sm text-gray-200 prose prose-invert overflow-x-auto"><div id="status_${uniqueId}" class="text-xs font-bold text-blue-400 mb-2 animate-pulse">[+] Contacting Omni-Core...</div><div id="${uniqueId}"></div></div></div>`);
            
            const contentElem = document.getElementById(uniqueId);
            const statusElem = document.getElementById(`status_${uniqueId}`);
            let fullReply = "";

            try {
                // Send chat history but replace the last message with our formatted payload
                const messagesToSend = [...chat.messages];
                messagesToSend[messagesToSend.length - 1] = payloadMessage;

                const response = await fetch(`${colabUrl}/v1/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Bypass-Tunnel-Reminder': 'true' },
                    body: JSON.stringify({ messages: messagesToSend, use_omni_vault: isRAGEnabled })
                });

                if (!response.ok) throw new Error("Offline");
                
                document.getElementById('statusDot').className = 'w-2 h-2 rounded-full bg-green-500'; document.getElementById('colabStatus').innerText = 'Colab Online';

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    const lines = decoder.decode(value, { stream: true }).split("\n");
                    for (let line of lines) {
                        if (line.startsWith("data: ")) {
                            const dataStr = line.replace("data: ", "").trim();
                            if (dataStr === "[DONE]") break;
                            try {
                                const parsed = JSON.parse(dataStr);
                                if (parsed.status) { if (parsed.status === "DONE") statusElem.classList.add('hidden'); else statusElem.innerText = parsed.status; }
                                if (parsed.content) {
                                    fullReply += parsed.content;
                                    // Parse DEEP THINKING in real-time
                                    let displayReply = fullReply.replace(/<think>/g, '<details open class="think-block mb-4 bg-black/40 border border-white/5 rounded-xl p-3"><summary class="cursor-pointer text-xs font-bold text-blue-400 flex items-center gap-2 select-none"><i class="ph ph-brain text-lg animate-pulse"></i> ApexNet Deep Thinking...</summary><div class="mt-3 text-xs text-gray-400 border-l-2 border-blue-500/30 pl-3">');
                                    displayReply = displayReply.replace(/<\/think>/g, '</div></details>');
                                    contentElem.innerHTML = marked.parse(displayReply);
                                    document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
                                }
                            } catch (e) {}
                        }
                    }
                }
                
                document.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
                chat.messages.push({ role: 'assistant', content: fullReply });
                await saveCloudData();

            } catch (err) {
                statusElem.classList.add('hidden');
                contentElem.innerHTML = `<span class='text-red-400 font-bold'>🚨 Connection Failed. Check Colab link.</span>`;
            } finally {
                isGenerating = false;
            }
        }

        checkPuterStatus();
    </script>
</body>
</html>
