<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ApexNet | Elite Neural Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { apexDark: '#0b0f19', apexCard: '#111827', apexHover: '#1f2937', apexAccent: '#3b82f6' } } } }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; height: 100dvh; display: flex; overflow: hidden; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        .prose pre { background: #030712 !important; border: 1px solid #1f2937; border-radius: 0.75rem; padding: 1rem; margin-top: 0.75rem; overflow-x: auto; }
        .prose code { font-family: 'Fira Code', monospace; font-size: 0.875rem; color: #60a5fa; }
        .prose p { margin-bottom: 0.85rem; line-height: 1.6; }
        .prose ul, .prose ol { margin-left: 1.25rem; margin-bottom: 0.85rem; }
        textarea { resize: none; overflow-y: hidden; }
        textarea:focus { outline: none; }
        @keyframes apexGlow { 0% { opacity: 0.3; } 50% { opacity: 1; text-shadow: 0 0 12px #3b82f6; } 100% { opacity: 0.3; } }
        .apex-glow { animation: apexGlow 2s infinite ease-in-out; }
    </style>
</head>
<body class="bg-apexDark text-gray-100 flex h-[100dvh] w-full selection:bg-blue-500/30 relative">

    <!-- 🔐 LOGIN MODAL -->
    <div id="authModal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-apexCard border border-white/10 w-full max-w-md rounded-3xl p-8 shadow-2xl space-y-6">
            <div class="text-center">
                <div class="inline-flex p-3.5 bg-blue-600/10 rounded-2xl text-blue-500 mb-3 border border-blue-500/20"><i class="ph ph-shield-check text-3xl"></i></div>
                <h2 class="text-2xl font-bold tracking-tight">ApexNet Secure Login</h2>
                <p class="text-xs text-gray-400 mt-1">Authenticate to access Neural GPU Cluster</p>
            </div>
            <div class="flex bg-[#0b0f19] p-1 rounded-xl border border-white/5 text-xs font-medium">
                <button onclick="switchTab('login')" id="tabLogin" class="flex-1 py-2.5 rounded-lg bg-blue-600 text-white transition-all shadow-md">Login</button>
                <button onclick="switchTab('signup')" id="tabSignup" class="flex-1 py-2.5 rounded-lg text-gray-400 hover:text-white transition-all">Signup</button>
            </div>
            <div class="space-y-4">
                <div><label class="text-xs text-gray-400 block mb-1 font-medium">Username</label><input type="text" id="authUsername" value="Ayushpandey_Boss" class="w-full bg-[#0b0f19] border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500"></div>
                <div><label class="text-xs text-gray-400 block mb-1 font-medium">Password</label><input type="password" id="authPassword" value="123456789@1234" class="w-full bg-[#0b0f19] border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500"></div>
                <div id="signupKeyBox" class="hidden"><label class="text-xs text-gray-400 block mb-1 font-medium">Activation Key</label><input type="text" id="authKey" placeholder="APEX-ADMIN-9999" class="w-full bg-[#0b0f19] border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500"></div>
                <p id="authError" class="text-xs text-red-400 text-center hidden font-medium"></p>
                <button onclick="handleAuthSubmit()" id="authSubmitBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl transition-all text-sm shadow-lg shadow-blue-600/30">Authenticate</button>
            </div>
        </div>
    </div>

    <!-- Sidebar -->
    <aside class="w-[280px] bg-apexCard flex-shrink-0 flex flex-col hidden md:flex border-r border-white/5 shadow-xl">
        <div class="p-4">
            <button onclick="createNewChat()" class="w-full flex items-center gap-3 px-4 py-3 rounded-2xl bg-blue-600 hover:bg-blue-500 transition-all text-sm font-semibold shadow-lg shadow-blue-600/20 text-white"><i class="ph ph-plus text-lg"></i> New Conversation</button>
        </div>
        <div class="flex-1 overflow-y-auto px-3 space-y-1.5" id="historyList"></div>
        <div class="p-4 border-t border-white/5 flex items-center justify-between text-xs text-gray-400 bg-[#0b0f19]/40">
            <div class="flex items-center gap-2">
                <div id="statusDot" class="w-2 h-2 rounded-full bg-yellow-500"></div>
                <span id="serverStatus" class="font-medium">Connecting...</span>
            </div>
            <button onclick="logout()" title="Logout" class="hover:text-red-400 transition-colors text-base"><i class="ph ph-sign-out"></i></button>
        </div>
    </aside>

    <!-- Main Chat Content -->
    <main class="flex-1 flex flex-col h-full w-full overflow-hidden relative bg-apexDark">
        <header class="md:hidden flex items-center justify-between p-4 border-b border-white/5 bg-apexCard text-white flex-shrink-0 shadow-md">
            <button onclick="document.querySelector('aside').classList.toggle('hidden')"><i class="ph ph-list text-2xl"></i></button>
            <h1 class="font-bold text-sm flex items-center gap-2"><i class="ph ph-cpu text-blue-500"></i> ApexNet God-Mode</h1>
            <div class="flex items-center gap-4">
                <i class="ph ph-sign-out text-xl cursor-pointer text-red-400" onclick="logout()"></i>
                <i class="ph ph-plus text-xl cursor-pointer text-blue-400" onclick="createNewChat()"></i>
            </div>
        </header>

        <div id="chatBox" class="flex-1 overflow-y-auto p-4 md:p-8 w-full max-w-4xl mx-auto flex flex-col gap-6">
            <div class="h-full flex flex-col items-center justify-center text-center px-4" id="welcomeScreen">
                <div class="w-20 h-20 bg-blue-600/10 border border-blue-500/20 rounded-3xl flex items-center justify-center mb-5 apex-glow shadow-2xl">
                    <i class="ph ph-cpu text-4xl text-blue-500"></i>
                </div>
                <h2 class="text-3xl font-extrabold tracking-tight mb-2 bg-gradient-to-r from-blue-400 via-indigo-400 to-purple-500 bg-clip-text text-transparent">ApexNet God-Mode</h2>
                <p class="text-gray-400 text-sm max-w-sm leading-relaxed">Live Web Research, Code Synthesis & Deep Thinking Enabled.</p>
            </div>
        </div>

        <div class="flex-shrink-0 w-full bg-gradient-to-t from-apexDark via-apexDark to-transparent pb-6 pt-2 px-4 md:px-8">
            <div class="max-w-3xl mx-auto relative flex items-end bg-apexCard border border-white/10 rounded-2xl overflow-hidden shadow-2xl focus-within:border-blue-500/60 transition-all p-2">
                <textarea id="userInput" rows="1" class="w-full max-h-[160px] bg-transparent py-3 pl-3 pr-12 text-sm md:text-base text-gray-100 placeholder-gray-500" placeholder="Ask anything (Coding, JEE, LSPosed)..."></textarea>
                <button id="sendBtn" onclick="handleSend()" class="absolute right-3 bottom-3 p-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl transition-all shadow-lg shadow-blue-600/30"><i class="ph ph-paper-plane-right text-lg font-bold"></i></button>
            </div>
            <div class="text-center mt-2 text-[11px] text-gray-500 font-medium">ApexNet Enterprise v4.1 • Anti-Timeout Cloudflare Bypass</div>
        </div>
    </main>

    <script>
        // 🔥 FIX 1: GITHUB CORE API INSTEAD OF CDN CACHE
        const GIST_API = "https://api.github.com/gists/6b0c7fa3c4ed32c7d6da9681876fb80f";
        let COLAB_URL = "";
        let AUTH_TOKEN = localStorage.getItem('apex_token') || "";
        let currentMode = 'login';
        let currentChatId = null;
        let chats = [];

        // 🔥 FIX 2: UNIVERSAL CLOUDFLARE BYPASS HEADER
        const secureHeaders = (isAuth = true) => {
            const h = { 'Content-Type': 'application/json', 'Bypass-Tunnel-Reminder': 'true' };
            if (isAuth && AUTH_TOKEN) h['Authorization'] = `Bearer ${AUTH_TOKEN}`;
            return h;
        };

        async function initSystem() {
            try {
                // Fetch directly from API to avoid CDN delay
                const linkRes = await fetch(`${GIST_API}?t=${new Date().getTime()}`);
                const gistData = await linkRes.json();
                COLAB_URL = gistData.files["colab_link.txt"].content.trim().replace(/\/$/, "");
                
                document.getElementById('serverStatus').innerText = 'Cluster Online';
                document.getElementById('statusDot').className = 'w-2 h-2 rounded-full bg-green-500';

                if (!AUTH_TOKEN) {
                    document.getElementById('authModal').classList.remove('hidden');
                } else {
                    await fetchCloudChats();
                }
            } catch (err) {
                document.getElementById('serverStatus').innerText = 'Offline';
                document.getElementById('statusDot').className = 'w-2 h-2 rounded-full bg-red-500';
            }
        }

        async function fetchCloudChats() {
            try {
                const res = await fetch(`${COLAB_URL}/v1/chats`, { headers: secureHeaders() });
                if (res.ok) {
                    const data = await res.json();
                    chats = data.chats || [];
                    verifyToken();
                    if (chats.length > 0) loadChat(chats[0].id);
                    else createNewChat();
                } else { logout(); }
            } catch (e) { document.getElementById('authModal').classList.remove('hidden'); }
        }

        async function saveCloudChat(chat) {
            try { await fetch(`${COLAB_URL}/v1/chats/save`, { method: 'POST', headers: secureHeaders(), body: JSON.stringify(chat) }); } 
            catch (e) {}
        }

        function switchTab(mode) {
            currentMode = mode;
            document.getElementById('tabLogin').className = mode === 'login' ? "flex-1 py-2.5 rounded-lg bg-blue-600 text-white transition-all shadow-md" : "flex-1 py-2.5 rounded-lg text-gray-400 hover:text-white transition-all";
            document.getElementById('tabSignup').className = mode === 'signup' ? "flex-1 py-2.5 rounded-lg bg-blue-600 text-white transition-all shadow-md" : "flex-1 py-2.5 rounded-lg text-gray-400 hover:text-white transition-all";
            document.getElementById('signupKeyBox').classList.toggle('hidden', mode === 'login');
            document.getElementById('authSubmitBtn').innerText = mode === 'login' ? "Authenticate" : "Create Account";
        }

        async function handleAuthSubmit() {
            const username = document.getElementById('authUsername').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            const key = document.getElementById('authKey').value.trim();
            const errBox = document.getElementById('authError');

            if (!username || !password) return errBox.classList.remove('hidden'), errBox.innerText = "Fill all fields";

            try {
                let endpoint = currentMode === 'login' ? '/v1/auth/login' : '/v1/auth/signup';
                let payload = currentMode === 'login' ? { username, password } : { username, password, activation_key: key };

                const res = await fetch(`${COLAB_URL}${endpoint}`, { method: 'POST', headers: secureHeaders(false), body: JSON.stringify(payload) });

                if (res.ok) {
                    const data = await res.json();
                    AUTH_TOKEN = data.token;
                    localStorage.setItem('apex_token', AUTH_TOKEN);
                    document.getElementById('authModal').classList.add('hidden');
                    errBox.classList.add('hidden');
                    await fetchCloudChats();
                } else {
                    const errData = await res.json();
                    errBox.innerText = errData.detail || "Auth Failed";
                    errBox.classList.remove('hidden');
                }
            } catch (err) {
                errBox.innerText = "Server error. Is Colab running?";
                errBox.classList.remove('hidden');
            }
        }

        function verifyToken() { document.getElementById('authModal').classList.add('hidden'); let welcome = document.getElementById('welcomeScreen'); if (welcome) welcome.remove(); }
        function logout() { localStorage.removeItem('apex_token'); AUTH_TOKEN = ""; document.getElementById('authModal').classList.remove('hidden'); }
        
        async function createNewChat() {
            currentChatId = 'chat_' + Date.now();
            const newChat = { id: currentChatId, title: "New Conversation", messages: [] };
            chats.unshift(newChat);
            renderHistory();
            document.getElementById('chatBox').innerHTML = ''; 
            await saveCloudChat(newChat);
        }

        function loadChat(id) {
            currentChatId = id;
            document.getElementById('chatBox').innerHTML = ''; 
            const chat = chats.find(c => c.id === id);
            if (chat) chat.messages.forEach(msg => appendMessageUI(msg.role, msg.content));
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = '';
            chats.forEach(chat => {
                const isActive = chat.id === currentChatId;
                list.innerHTML += `<button onclick="loadChat('${chat.id}')" class="w-full text-left flex items-center gap-3 px-3 py-2.5 rounded-xl ${isActive ? 'bg-blue-600/10 border border-blue-500/20 text-white font-medium' : 'text-gray-400 hover:bg-apexHover'} transition-all text-sm truncate"><i class="ph ph-chat-teardrop text-base"></i><span class="truncate">${chat.title}</span></button>`;
            });
        }

        function appendMessageUI(role, text) {
            const chatBox = document.getElementById('chatBox');
            if (document.getElementById('welcomeScreen')) document.getElementById('welcomeScreen').remove();

            const isUser = role === 'user';
            const msgRow = document.createElement('div');
            msgRow.className = `w-full flex my-3 px-2 md:px-4 ${isUser ? 'justify-end' : 'justify-start'}`;

            if (isUser) {
                msgRow.innerHTML = `<div class="max-w-[85%] md:max-w-[70%] bg-blue-600 text-white px-5 py-3.5 rounded-2xl rounded-tr-sm shadow-lg text-sm md:text-base leading-relaxed break-words">${text}</div>`;
            } else {
                msgRow.innerHTML = `
                    <div class="max-w-[90%] md:max-w-[80%] flex gap-3.5 items-start bg-apexCard border border-white/5 px-4 md:px-6 py-4 rounded-2xl rounded-tl-sm shadow-xl text-sm md:text-base text-gray-200">
                        <div class="w-8 h-8 rounded-xl bg-blue-600/20 border border-blue-500/30 flex-shrink-0 flex items-center justify-center text-blue-400 shadow-sm mt-0.5"><i class="ph ph-cpu text-lg"></i></div>
                        <div class="prose prose-invert max-w-none w-full overflow-x-auto">${marked.parse(text)}</div>
                    </div>`;
            }
            chatBox.appendChild(msgRow);
            document.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function handleSend() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            if (!currentChatId) await createNewChat();
            
            appendMessageUI('user', text);
            input.value = ''; input.style.height = 'auto';

            if (!AUTH_TOKEN) { document.getElementById('authModal').classList.remove('hidden'); return; }

            const chat = chats.find(c => c.id === currentChatId);
            if (chat.messages.length === 0) chat.title = text.substring(0, 25) + "...";
            chat.messages.push({ role: 'user', content: text });
            await saveCloudChat(chat);
            renderHistory();

            const chatBox = document.getElementById('chatBox');
            if (document.getElementById('welcomeScreen')) document.getElementById('welcomeScreen').remove();

            const aiRow = document.createElement('div');
            aiRow.className = `w-full flex my-3 px-2 md:px-4 justify-start`;
            aiRow.innerHTML = `
                <div class="max-w-[90%] md:max-w-[80%] flex gap-3.5 items-start bg-apexCard border border-white/5 px-4 md:px-6 py-4 rounded-2xl rounded-tl-sm shadow-xl text-sm md:text-base text-gray-200 w-full">
                    <div class="w-8 h-8 rounded-xl bg-blue-600/20 border border-blue-500/30 flex-shrink-0 flex items-center justify-center text-blue-400 shadow-sm mt-0.5 apex-glow"><i class="ph ph-cpu text-lg"></i></div>
                    <div class="prose prose-invert max-w-none w-full overflow-x-auto" id="streamingContent"><span class="inline-block w-2.5 h-4 bg-blue-500 animate-pulse ml-1 align-middle"></span></div>
                </div>`;
            chatBox.appendChild(aiRow);
            chatBox.scrollTop = chatBox.scrollHeight;

            const contentElem = document.getElementById('streamingContent');
            let fullReply = "";

            try {
                // 🔥 THE FIX: Using secureHeaders which includes Bypass-Tunnel-Reminder
                const response = await fetch(`${COLAB_URL}/v1/chat`, {
                    method: 'POST',
                    headers: secureHeaders(),
                    body: JSON.stringify(chat)
                });

                if (!response.ok) throw new Error("Stream failed");

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split("\n");

                    for (let line of lines) {
                        if (line.startsWith("data: ")) {
                            const dataStr = line.replace("data: ", "").trim();
                            if (dataStr === "[DONE]") break;
                            try {
                                const parsed = JSON.parse(dataStr);
                                if (parsed.content) {
                                    fullReply += parsed.content;
                                    contentElem.innerHTML = marked.parse(fullReply) + '<span class="inline-block w-2.5 h-4 bg-blue-500 animate-pulse ml-1 align-middle"></span>';
                                    chatBox.scrollTop = chatBox.scrollHeight;
                                }
                            } catch (e) {}
                        }
                    }
                }

                contentElem.innerHTML = marked.parse(fullReply);
                document.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));

                chat.messages.push({ role: 'assistant', content: fullReply });
                await saveCloudChat(chat);

            } catch (err) {
                contentElem.innerHTML = "🚨 Neural Cluster disconnected. Cloudflare/Colab Tunnel Error.";
            }
        }

        const input = document.getElementById('userInput');
        input.addEventListener('input', function() { this.style.height = 'auto'; this.style.height = this.scrollHeight + 'px'; });
        input.addEventListener('keydown', function(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } });

        if (chats.length === 0) initSystem();
        else renderHistory();
        initSystem();
    </script>
</body>
</html>
