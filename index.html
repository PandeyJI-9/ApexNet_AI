<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ApexNet | Restricted Neural Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { apexDark: '#070a10', apexCard: '#0f141f', apexHover: '#171e2e', apexAccent: '#2563eb' } } } }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { background-color: #070a10; color: #f3f4f6; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; height: 100dvh; display: flex; overflow: hidden; background-image: radial-gradient(circle at 50% 0%, #1e3a8a15 0%, transparent 70%); }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        .prose pre { background: #030508 !important; border: 1px solid #1f2937; border-radius: 0.75rem; padding: 1rem; margin-top: 0.75rem; overflow-x: auto; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
        .prose code { font-family: 'Fira Code', monospace; font-size: 0.85rem; color: #60a5fa; }
        .prose p { margin-bottom: 0.85rem; line-height: 1.6; }
        textarea { resize: none; overflow-y: hidden; }
        textarea:focus { outline: none; }
        @keyframes apexGlow { 0% { opacity: 0.4; text-shadow: 0 0 10px #3b82f6; } 50% { opacity: 1; text-shadow: 0 0 25px #60a5fa; } 100% { opacity: 0.4; text-shadow: 0 0 10px #3b82f6; } }
        .apex-glow { animation: apexGlow 2.5s infinite ease-in-out; }
        .matrix-bg { background-image: linear-gradient(rgba(11, 15, 25, 0.9), rgba(11, 15, 25, 0.9)), url('https://www.transparenttextures.com/patterns/cubes.png'); }
    </style>
</head>
<body class="matrix-bg text-gray-100 flex h-[100dvh] w-full selection:bg-blue-600/30 relative">

    <!-- 🔐 RESTRICTED LOGIN MODAL (Aura Farming Edition) -->
    <div id="authModal" class="fixed inset-0 bg-black/90 backdrop-blur-xl z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-apexCard border border-blue-500/20 w-full max-w-md rounded-2xl p-8 shadow-[0_0_50px_-12px_rgba(37,99,235,0.25)] space-y-6 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-blue-500 to-transparent opacity-50"></div>
            <div class="text-center">
                <div class="inline-flex p-3 bg-blue-900/20 rounded-xl text-blue-500 mb-4 border border-blue-500/30 shadow-[0_0_15px_rgba(37,99,235,0.2)]"><i class="ph ph-fingerprint text-4xl"></i></div>
                <h2 class="text-2xl font-extrabold tracking-tight text-white">Classified Access</h2>
                <p class="text-xs text-red-400 mt-2 font-medium tracking-wide uppercase">🚨 Unauthorized access prohibited 🚨</p>
                <p class="text-[11px] text-gray-400 mt-1">For login credentials, you need to contact Ayush.</p>
            </div>
            <div class="flex bg-[#070a10] p-1 rounded-lg border border-white/5 text-xs font-semibold uppercase tracking-wider">
                <button onclick="switchTab('login')" id="tabLogin" class="flex-1 py-2.5 rounded-md bg-blue-600 text-white transition-all shadow-md">Login</button>
                <button onclick="switchTab('signup')" id="tabSignup" class="flex-1 py-2.5 rounded-md text-gray-500 hover:text-white transition-all">Request Access</button>
            </div>
            <div class="space-y-4">
                <div><label class="text-xs text-gray-400 block mb-1 font-semibold uppercase">Identity String</label><input type="text" id="authUsername" placeholder="e.g., Ayush_GodMode" class="w-full bg-[#070a10] border border-white/10 rounded-lg px-4 py-3 text-sm text-blue-100 focus:outline-none focus:border-blue-500 transition-colors"></div>
                <div><label class="text-xs text-gray-400 block mb-1 font-semibold uppercase">Security Cipher</label><input type="password" id="authPassword" placeholder="••••••••••••" class="w-full bg-[#070a10] border border-white/10 rounded-lg px-4 py-3 text-sm text-blue-100 focus:outline-none focus:border-blue-500 transition-colors"></div>
                <div id="signupKeyBox" class="hidden"><label class="text-xs text-gray-400 block mb-1 font-semibold uppercase">Clearance Key</label><input type="text" id="authKey" placeholder="Contact Ayush for your key" class="w-full bg-[#070a10] border border-white/10 rounded-lg px-4 py-3 text-sm text-blue-100 focus:outline-none focus:border-blue-500 transition-colors placeholder:text-gray-600"></div>
                <p id="authError" class="text-xs text-red-500 text-center hidden font-bold bg-red-500/10 py-2 rounded-md border border-red-500/20"></p>
                <button onclick="handleAuthSubmit()" id="authSubmitBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold tracking-widest uppercase py-3 rounded-lg transition-all text-xs shadow-[0_0_20px_rgba(37,99,235,0.4)]">Establish Connection</button>
            </div>
        </div>
    </div>

    <!-- Sidebar -->
    <aside class="w-[280px] bg-apexCard flex-shrink-0 flex flex-col hidden md:flex border-r border-white/5 shadow-2xl relative z-10">
        <div class="p-4 border-b border-white/5">
            <button onclick="createNewChat()" class="w-full flex items-center justify-center gap-3 px-4 py-3 rounded-xl bg-blue-600/10 hover:bg-blue-600/20 border border-blue-500/30 transition-all text-sm font-bold text-blue-400 shadow-sm"><i class="ph ph-plus-circle text-lg"></i> Initialize Protocol</button>
        </div>
        <div class="flex-1 overflow-y-auto px-3 py-2 space-y-1" id="historyList"></div>
        <div class="p-4 border-t border-white/5 flex flex-col gap-2 text-xs bg-[#070a10]/50">
            <div class="flex items-center justify-between text-gray-400">
                <div class="flex items-center gap-2 font-medium"><div id="statusDot" class="w-2 h-2 rounded-full bg-yellow-500 shadow-[0_0_8px_rgba(234,179,8,0.8)]"></div><span id="serverStatus">Syncing Cluster...</span></div>
                <button onclick="logout()" title="Terminate Session" class="hover:text-red-500 transition-colors text-base"><i class="ph ph-power"></i></button>
            </div>
            <div class="text-[10px] font-bold text-blue-500/50 uppercase tracking-widest text-center mt-1">Aura Level: Infinite ♾️</div>
        </div>
    </aside>

    <!-- Main Chat Content -->
    <main class="flex-1 flex flex-col h-full w-full overflow-hidden relative">
        <header class="md:hidden flex items-center justify-between p-4 border-b border-white/5 bg-apexCard text-white flex-shrink-0 shadow-md">
            <button onclick="document.querySelector('aside').classList.toggle('hidden')"><i class="ph ph-list text-2xl text-blue-400"></i></button>
            <h1 class="font-bold text-xs tracking-widest uppercase flex items-center gap-2"><i class="ph ph-cpu text-blue-500"></i> ApexNet Core</h1>
            <div class="flex items-center gap-4">
                <i class="ph ph-power text-lg cursor-pointer text-red-500" onclick="logout()"></i>
                <i class="ph ph-plus-circle text-xl cursor-pointer text-blue-400" onclick="createNewChat()"></i>
            </div>
        </header>

        <div id="chatBox" class="flex-1 overflow-y-auto p-4 md:p-8 w-full max-w-5xl mx-auto flex flex-col gap-6 scroll-smooth">
            <!-- Welcome Screen by Default -->
        </div>

        <div class="flex-shrink-0 w-full bg-gradient-to-t from-[#070a10] via-[#070a10] to-transparent pb-6 pt-4 px-4 md:px-8">
            <div class="max-w-4xl mx-auto relative flex items-end bg-apexHover border border-white/10 rounded-2xl overflow-hidden shadow-[0_10px_40px_-10px_rgba(0,0,0,0.8)] focus-within:border-blue-500/50 transition-all p-1.5">
                <textarea id="userInput" rows="1" class="w-full max-h-[200px] bg-transparent py-3.5 pl-4 pr-14 text-sm md:text-base text-gray-100 placeholder-gray-500" placeholder="Execute command..."></textarea>
                <button id="sendBtn" onclick="handleSend()" class="absolute right-2 bottom-2 p-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl transition-all shadow-[0_0_15px_rgba(37,99,235,0.4)]"><i class="ph ph-paper-plane-tilt text-xl font-bold"></i></button>
            </div>
            <div class="text-center mt-3 text-[10px] text-gray-600 font-bold uppercase tracking-[0.2em]">Engineered by Ayush • ApexNet God-Mode Engine</div>
        </div>
    </main>

    <script>
        const GIST_API = "https://api.github.com/gists/6b0c7fa3c4ed32c7d6da9681876fb80f";
        let COLAB_URL = "";
        let AUTH_TOKEN = localStorage.getItem('apex_token') || "";
        let currentMode = 'login';
        let currentChatId = null;
        let chats = [];
        let isGenerating = false; 

        const secureHeaders = (isAuth = true) => {
            const h = { 'Content-Type': 'application/json', 'Bypass-Tunnel-Reminder': 'true' };
            if (isAuth && AUTH_TOKEN) h['Authorization'] = `Bearer ${AUTH_TOKEN}`;
            return h;
        };

        const renderWelcomeScreen = () => {
            return `
            <div class="h-full flex flex-col items-center justify-center text-center px-4" id="welcomeScreen">
                <div class="w-24 h-24 bg-blue-900/20 border border-blue-500/30 rounded-full flex items-center justify-center mb-6 apex-glow shadow-[0_0_40px_rgba(37,99,235,0.15)] relative">
                    <div class="absolute inset-0 rounded-full border border-blue-400/20 animate-ping"></div>
                    <i class="ph ph-cpu text-5xl text-blue-400"></i>
                </div>
                <h2 class="text-4xl font-black tracking-tighter mb-3 bg-gradient-to-br from-white via-blue-200 to-blue-600 bg-clip-text text-transparent uppercase">Terminal Access Granted</h2>
                <div class="flex gap-2 mb-4">
                    <span class="px-3 py-1 text-[10px] font-bold uppercase tracking-widest text-blue-400 bg-blue-900/30 border border-blue-500/20 rounded-md">God-Mode Active</span>
                    <span class="px-3 py-1 text-[10px] font-bold uppercase tracking-widest text-green-400 bg-green-900/30 border border-green-500/20 rounded-md">Live Research</span>
                </div>
                <p class="text-gray-400 text-sm max-w-md leading-relaxed">Neural Engine synchronized. Awaiting elite execution commands.</p>
            </div>`;
        };

        async function initSystem() {
            document.getElementById('chatBox').innerHTML = renderWelcomeScreen(); 
            try {
                const linkRes = await fetch(`${GIST_API}?t=${new Date().getTime()}`);
                const gistData = await linkRes.json();
                COLAB_URL = gistData.files["colab_link.txt"].content.trim().replace(/\/$/, "");
                
                document.getElementById('serverStatus').innerText = 'Cluster Active';
                document.getElementById('statusDot').className = 'w-2 h-2 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.8)]';

                if (!AUTH_TOKEN) { document.getElementById('authModal').classList.remove('hidden'); } 
                else { await fetchCloudChats(); }
            } catch (err) {
                document.getElementById('serverStatus').innerText = 'Cluster Offline';
                document.getElementById('statusDot').className = 'w-2 h-2 rounded-full bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.8)]';
            }
        }

        async function fetchCloudChats() {
            try {
                const res = await fetch(`${COLAB_URL}/v1/chats`, { headers: secureHeaders() });
                if (res.ok) {
                    const data = await res.json();
                    chats = data.chats || [];
                    verifyToken();
                    if (chats.length > 0) loadChat(chats[0].id);
                    else createNewChat();
                } else { logout(); }
            } catch (e) { document.getElementById('authModal').classList.remove('hidden'); }
        }

        async function saveCloudChat(chat) {
            try { await fetch(`${COLAB_URL}/v1/chats/save`, { method: 'POST', headers: secureHeaders(), body: JSON.stringify(chat) }); } 
            catch (e) {}
        }

        function switchTab(mode) {
            currentMode = mode;
            document.getElementById('tabLogin').className = mode === 'login' ? "flex-1 py-2.5 rounded-md bg-blue-600 text-white transition-all shadow-md" : "flex-1 py-2.5 rounded-md text-gray-500 hover:text-white transition-all";
            document.getElementById('tabSignup').className = mode === 'signup' ? "flex-1 py-2.5 rounded-md bg-blue-600 text-white transition-all shadow-md" : "flex-1 py-2.5 rounded-md text-gray-500 hover:text-white transition-all";
            document.getElementById('signupKeyBox').classList.toggle('hidden', mode === 'login');
            document.getElementById('authSubmitBtn').innerText = mode === 'login' ? "Establish Connection" : "Verify Clearance";
        }

        async function handleAuthSubmit() {
            const username = document.getElementById('authUsername').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            const key = document.getElementById('authKey').value.trim();
            const errBox = document.getElementById('authError');

            if (!username || !password) {
                errBox.classList.remove('hidden');
                errBox.innerText = "Error: Authentication parameters missing.";
                return;
            }

            try {
                let endpoint = currentMode === 'login' ? '/v1/auth/login' : '/v1/auth/signup';
                let payload = currentMode === 'login' ? { username, password } : { username, password, activation_key: key };

                const res = await fetch(`${COLAB_URL}${endpoint}`, { method: 'POST', headers: secureHeaders(false), body: JSON.stringify(payload) });

                if (res.ok) {
                    const data = await res.json();
                    AUTH_TOKEN = data.token;
                    localStorage.setItem('apex_token', AUTH_TOKEN);
                    document.getElementById('authModal').classList.add('hidden');
                    errBox.classList.add('hidden');
                    await fetchCloudChats();
                } else {
                    const errData = await res.json();
                    errBox.innerText = `Access Denied: ${errData.detail || 'Invalid Credentials'}. Contact Ayush for access.`;
                    errBox.classList.remove('hidden');
                }
            } catch (err) {
                errBox.innerText = "Connection Failed. Core neural cluster might be offline.";
                errBox.classList.remove('hidden');
            }
        }

        function verifyToken() { document.getElementById('authModal').classList.add('hidden'); }
        function logout() { localStorage.removeItem('apex_token'); AUTH_TOKEN = ""; document.getElementById('authModal').classList.remove('hidden'); }
        
        async function createNewChat() {
            if (isGenerating) return; 
            currentChatId = 'chat_' + Date.now();
            const newChat = { id: currentChatId, title: "Classified Intel", messages: [] };
            chats.unshift(newChat);
            renderHistory();
            document.getElementById('chatBox').innerHTML = renderWelcomeScreen(); 
            await saveCloudChat(newChat);
        }

        function loadChat(id) {
            if (isGenerating) return; 
            currentChatId = id;
            document.getElementById('chatBox').innerHTML = ''; 
            const chat = chats.find(c => c.id === id);
            
            if (chat && chat.messages.length > 0) {
                chat.messages.forEach(msg => appendMessageUI(msg.role, msg.content));
            } else {
                document.getElementById('chatBox').innerHTML = renderWelcomeScreen();
            }
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = '';
            chats.forEach(chat => {
                const isActive = chat.id === currentChatId;
                list.innerHTML += `<button onclick="loadChat('${chat.id}')" class="w-full text-left flex items-center gap-3 px-3 py-3 rounded-xl ${isActive ? 'bg-blue-600/10 border border-blue-500/30 text-blue-100 font-semibold shadow-inner' : 'text-gray-400 hover:bg-apexHover border border-transparent'} transition-all text-sm truncate"><i class="ph ph-terminal-window text-base text-blue-500"></i><span class="truncate tracking-wide">${chat.title}</span></button>`;
            });
        }

        function appendMessageUI(role, text) {
            const chatBox = document.getElementById('chatBox');
            if (document.getElementById('welcomeScreen')) document.getElementById('welcomeScreen').remove();

            const isUser = role === 'user';
            const msgRow = document.createElement('div');
            msgRow.className = `w-full flex my-4 px-2 md:px-4 ${isUser ? 'justify-end' : 'justify-start'}`;

            if (isUser) {
                msgRow.innerHTML = `<div class="max-w-[85%] md:max-w-[70%] bg-blue-600 text-white px-5 py-4 rounded-2xl rounded-tr-sm shadow-[0_5px_20px_-5px_rgba(37,99,235,0.4)] text-sm md:text-base leading-relaxed break-words font-medium tracking-wide">${text}</div>`;
            } else {
                msgRow.innerHTML = `
                    <div class="max-w-[95%] md:max-w-[85%] flex gap-4 items-start bg-apexHover border border-white/5 px-5 md:px-6 py-5 rounded-2xl rounded-tl-sm shadow-xl text-sm md:text-base text-gray-200">
                        <div class="w-9 h-9 rounded-xl bg-blue-900/30 border border-blue-500/40 flex-shrink-0 flex items-center justify-center text-blue-400 shadow-[0_0_10px_rgba(37,99,235,0.2)] mt-0.5"><i class="ph ph-cpu text-xl"></i></div>
                        <div class="prose prose-invert max-w-none w-full overflow-x-auto leading-loose">${marked.parse(text)}</div>
                    </div>`;
            }
            chatBox.appendChild(msgRow);
            document.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function handleSend() {
            if (isGenerating) return; 
            
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            if (!AUTH_TOKEN) { document.getElementById('authModal').classList.remove('hidden'); return; }

            isGenerating = true; 

            if (!currentChatId) await createNewChat();
            
            appendMessageUI('user', text);
            input.value = ''; input.style.height = 'auto';

            const chat = chats.find(c => c.id === currentChatId);
            if (chat.messages.length === 0) chat.title = text.substring(0, 25) + "...";
            chat.messages.push({ role: 'user', content: text });
            await saveCloudChat(chat);
            renderHistory();

            const chatBox = document.getElementById('chatBox');
            if (document.getElementById('welcomeScreen')) document.getElementById('welcomeScreen').remove();

            const uniqueStreamId = 'stream_' + Date.now();

            const aiRow = document.createElement('div');
            aiRow.className = `w-full flex my-4 px-2 md:px-4 justify-start`;
            aiRow.innerHTML = `
                <div class="max-w-[95%] md:max-w-[85%] flex gap-4 items-start bg-apexHover border border-blue-500/20 px-5 md:px-6 py-5 rounded-2xl rounded-tl-sm shadow-[0_0_30px_-5px_rgba(37,99,235,0.15)] text-sm md:text-base text-gray-200 w-full relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-1 h-full bg-blue-500 shadow-[0_0_15px_#3b82f6]"></div>
                    <div class="w-9 h-9 rounded-xl bg-blue-900/30 border border-blue-500/40 flex-shrink-0 flex items-center justify-center text-blue-400 shadow-sm mt-0.5 apex-glow"><i class="ph ph-cpu text-xl"></i></div>
                    <div class="prose prose-invert max-w-none w-full overflow-x-auto leading-loose font-medium" id="${uniqueStreamId}"><span class="inline-block w-2.5 h-4 bg-blue-400 animate-pulse ml-1 align-middle shadow-[0_0_8px_#60a5fa]"></span></div>
                </div>`;
            chatBox.appendChild(aiRow);
            chatBox.scrollTop = chatBox.scrollHeight;

            const contentElem = document.getElementById(uniqueStreamId);
            let fullReply = "";

            try {
                const response = await fetch(`${COLAB_URL}/v1/chat`, {
                    method: 'POST',
                    headers: secureHeaders(),
                    body: JSON.stringify(chat)
                });

                if (!response.ok) throw new Error("Stream failed");

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split("\n");

                    for (let line of lines) {
                        if (line.startsWith("data: ")) {
                            const dataStr = line.replace("data: ", "").trim();
                            if (dataStr === "[DONE]") break;
                            try {
                                const parsed = JSON.parse(dataStr);
                                if (parsed.content) {
                                    fullReply += parsed.content;
                                    contentElem.innerHTML = marked.parse(fullReply) + '<span class="inline-block w-2.5 h-4 bg-blue-400 animate-pulse ml-1 align-middle shadow-[0_0_8px_#60a5fa]"></span>';
                                    chatBox.scrollTop = chatBox.scrollHeight;
                                }
                            } catch (e) {}
                        }
                    }
                }

                contentElem.innerHTML = marked.parse(fullReply);
                document.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));

                chat.messages.push({ role: 'assistant', content: fullReply });
                await saveCloudChat(chat);

            } catch (err) {
                contentElem.innerHTML = "<span class='text-red-400 font-bold'>🚨 Connection Severed. Check Neural Cluster Status.</span>";
            } finally {
                isGenerating = false; 
                aiRow.firstElementChild.classList.remove('border-blue-500/20');
                aiRow.firstElementChild.classList.add('border-white/5');
                aiRow.firstElementChild.querySelector('.absolute').remove();
            }
        }

        const input = document.getElementById('userInput');
        input.addEventListener('input', function() { this.style.height = 'auto'; this.style.height = this.scrollHeight + 'px'; });
        input.addEventListener('keydown', function(e) { 
            if (e.key === 'Enter' && !e.shiftKey) { 
                e.preventDefault(); 
                if (!isGenerating) handleSend(); 
            } 
        });

        if (chats.length === 0) initSystem();
        else renderHistory();
        initSystem();
    </script>
</body>
</html>
