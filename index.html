<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexNet 7.6B | Elite AI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        glass: "rgba(17, 25, 40, 0.75)",
                        glassBorder: "rgba(255, 255, 255, 0.125)",
                    }
                }
            }
        }
    </script>
    <!-- Markdown & Syntax Highlighting -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Premium Glassmorphism & Animations */
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            margin: 0; height: 100vh; overflow: hidden;
        }
        .glass-panel {
            background: var(--tw-colors-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--tw-colors-glassBorder);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }
        
        .chat-container { height: calc(100vh - 140px); overflow-y: auto; scroll-behavior: smooth; }
        .message-ai { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 0 1rem 1rem 1rem; }
        .message-user { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); border-radius: 1rem 0 1rem 1rem; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4); }
        
        /* Code Block Styling */
        pre { background: #1a1a2e !important; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; border: 1px solid rgba(255,255,255,0.1); margin-top: 0.5rem;}
        code { font-family: 'Fira Code', monospace; }
        
        /* Typing indicator animation */
        .dot { animation: blink 1.4s infinite both; height: 8px; width: 8px; background: #fff; border-radius: 50%; display: inline-block; margin: 0 2px; }
        .dot:nth-child(1) { animation-delay: 0.2s; }
        .dot:nth-child(2) { animation-delay: 0.4s; }
        .dot:nth-child(3) { animation-delay: 0.6s; }
        @keyframes blink { 0% { opacity: 0.2; } 20% { opacity: 1; } 100% { opacity: 0.2; } }
    </style>
</head>
<body class="flex">

    <!-- Sidebar (History) -->
    <aside class="glass-panel w-72 h-full flex flex-col hidden md:flex border-r transition-all duration-300 z-20">
        <div class="p-4 border-b border-white/10 flex justify-between items-center">
            <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">ApexNet 7.6B</h1>
            <button onclick="createNewChat()" class="text-gray-400 hover:text-white"><i class="fas fa-plus"></i></button>
        </div>
        <div class="p-3 text-sm text-gray-400 uppercase tracking-wider font-semibold">Chat History</div>
        <div id="historyList" class="flex-1 overflow-y-auto p-2 space-y-2">
            <!-- Dynamic History injected here -->
        </div>
        <div class="p-4 border-t border-white/10 text-xs text-gray-500 flex items-center justify-between">
            <span>Server Status:</span>
            <span id="serverStatus" class="text-yellow-400 flex items-center gap-1"><i class="fas fa-circle text-[8px]"></i> Fetching...</span>
        </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="flex-1 flex flex-col h-full relative">
        <!-- Mobile Header -->
        <header class="md:hidden glass-panel p-4 flex justify-between items-center border-b z-10">
            <h1 class="text-lg font-bold">ApexNet</h1>
            <button onclick="document.querySelector('aside').classList.toggle('hidden')" class="text-white"><i class="fas fa-bars"></i></button>
        </header>

        <!-- Chat Output -->
        <div id="chatBox" class="chat-container p-4 md:p-8 flex flex-col gap-6 w-full max-w-4xl mx-auto">
            <div class="text-center text-gray-500 mt-10">
                <i class="fas fa-robot text-4xl mb-3 text-blue-500 opacity-50"></i>
                <h2 class="text-xl font-semibold text-gray-300">Welcome to ApexNet Elite</h2>
                <p class="text-sm mt-2">Server auto-patching in background...</p>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-4 w-full max-w-4xl mx-auto absolute bottom-0 left-0 right-0">
            <div class="glass-panel p-2 rounded-2xl flex items-end gap-2 shadow-2xl">
                <textarea id="userInput" rows="1" class="w-full bg-transparent text-white p-3 focus:outline-none resize-none max-h-32" placeholder="Send a message to ApexNet..." oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'"></textarea>
                <button id="sendBtn" onclick="handleSend()" class="bg-blue-600 hover:bg-blue-500 text-white p-3 rounded-xl transition-all duration-200 mb-1">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </main>

    <script>
        // --- 1. CORE SYSTEM VARIABLES ---
        const KVDB_URL = "https://kvdb.io/J1ibE3hFShkohLKyCTRmbT/colab_link";
        let COLAB_URL = "";
        let AUTH_TOKEN = "";
        const USERNAME = "Ayushpandey_Boss";
        const PASSWORD = "123456789@1234";
        
        let currentChatId = null;
        let chats = JSON.parse(localStorage.getItem('apex_chats')) || [];

        // --- 2. AUTO-PATCHER & LOGIN SYSTEM ---
        async function initSystem() {
            try {
                // Fetch dynamic URL
                document.getElementById('serverStatus').innerHTML = '<i class="fas fa-circle text-[8px]"></i> Patching...';
                const linkRes = await fetch(KVDB_URL);
                COLAB_URL = (await linkRes.text()).trim().replace(/\/$/, "");
                console.log("🔗 Live URL:", COLAB_URL);

                // Auto Login
                const loginRes = await fetch(`${COLAB_URL}/v1/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: USERNAME, password: PASSWORD })
                });

                if (loginRes.ok) {
                    const data = await loginRes.json();
                    AUTH_TOKEN = data.token;
                    document.getElementById('serverStatus').innerHTML = '<i class="fas fa-circle text-[8px] text-green-400"></i> Online';
                    document.getElementById('serverStatus').className = "text-green-400 flex items-center gap-1";
                } else {
                    document.getElementById('serverStatus').innerHTML = '<i class="fas fa-circle text-[8px] text-red-500"></i> Auth Failed';
                }
            } catch (err) {
                console.error("System Init Error:", err);
                document.getElementById('serverStatus').innerHTML = '<i class="fas fa-circle text-[8px] text-red-500"></i> Offline';
            }
        }

        // --- 3. CHAT HISTORY (Bug Fixed!) ---
        function saveChats() {
            localStorage.setItem('apex_chats', JSON.stringify(chats));
            renderHistory();
        }

        function createNewChat() {
            currentChatId = Date.now().toString();
            chats.unshift({ id: currentChatId, title: "New Chat", messages: [] });
            saveChats();
            document.getElementById('chatBox').innerHTML = ''; // Clear UI
        }

        function loadChat(id) {
            currentChatId = id;
            const chat = chats.find(c => c.id === id);
            document.getElementById('chatBox').innerHTML = '';
            if (chat) {
                chat.messages.forEach(msg => appendMessage(msg.role, msg.content, false));
            }
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = '';
            chats.forEach(chat => {
                list.innerHTML += `
                    <div onclick="loadChat('${chat.id}')" class="p-3 rounded-lg cursor-pointer transition-all hover:bg-white/10 ${chat.id === currentChatId ? 'bg-white/10 border-l-2 border-blue-500' : ''}">
                        <div class="truncate text-sm text-gray-200"><i class="far fa-comment-alt mr-2 text-gray-500"></i> ${chat.title}</div>
                    </div>
                `;
            });
        }

        // --- 4. MESSAGE RENDERING ---
        function appendMessage(role, text, save = true) {
            const chatBox = document.getElementById('chatBox');
            // Remove welcome screen if present
            if (chatBox.innerHTML.includes('Welcome to ApexNet')) chatBox.innerHTML = '';

            const isUser = role === 'user';
            
            // Format AI response with Markdown and Syntax Highlighting
            let formattedText = isUser ? text : marked.parse(text);
            
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex w-full ${isUser ? 'justify-end' : 'justify-start'}`;
            msgDiv.innerHTML = `
                <div class="max-w-[85%] p-4 ${isUser ? 'message-user text-white' : 'message-ai text-gray-200'}">
                    <div class="prose prose-invert max-w-none text-sm md:text-base leading-relaxed">
                        ${formattedText}
                    </div>
                </div>
            `;
            chatBox.appendChild(msgDiv);
            
            // Apply syntax highlighting to new code blocks
            document.querySelectorAll('pre code').forEach((el) => { hljs.highlightElement(el); });
            chatBox.scrollTop = chatBox.scrollHeight;

            // Save to history
            if (save && currentChatId) {
                const chat = chats.find(c => c.id === currentChatId);
                if (chat) {
                    if (chat.messages.length === 0 && isUser) {
                        chat.title = text.substring(0, 25) + "..."; // Auto title
                    }
                    chat.messages.push({ role, content: text });
                    saveChats();
                }
            }
        }

        function showTyping() {
            const chatBox = document.getElementById('chatBox');
            const typingDiv = document.createElement('div');
            typingDiv.id = 'typingIndicator';
            typingDiv.className = 'flex w-full justify-start';
            typingDiv.innerHTML = `
                <div class="max-w-[85%] p-4 message-ai text-gray-200">
                    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
                </div>
            `;
            chatBox.appendChild(typingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function hideTyping() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
        }

        // --- 5. NETWORK COMMUNICATION ---
        async function handleSend() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            if (!currentChatId) createNewChat();

            appendMessage('user', text);
            input.value = '';
            input.style.height = 'auto'; // Reset textarea height
            showTyping();

            if (!AUTH_TOKEN) {
                hideTyping();
                appendMessage('ai', "⚠️ Error: Backend se connect nahi ho paya. Refresh karo ya Colab check karo.");
                return;
            }

            try {
                const res = await fetch(`${COLAB_URL}/v1/chat`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${AUTH_TOKEN}`
                    },
                    body: JSON.stringify({ message: text })
                });

                hideTyping();
                if (res.ok) {
                    const data = await res.json();
                    appendMessage('ai', data.reply);
                } else {
                    appendMessage('ai', `⚠️ Server Error: ${res.status}`);
                }
            } catch (err) {
                hideTyping();
                appendMessage('ai', `🚨 Network Crash! Cloudflare link block ho gaya ya Colab band hai.\n\nError: ${err.message}`);
            }
        }

        // Handle Enter key (Shift+Enter for new line)
        document.getElementById('userInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });

        // --- 6. BOOT SEQUENCE ---
        if (chats.length === 0) createNewChat();
        else loadChat(chats[0].id);
        renderHistory();
        
        // Start booting
        initSystem();

    </script>
</body>
</html>
