<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ApexNet | Elite Developer Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { gray900: '#171717', gray800: '#212121', gray700: '#2f2f2f' } } } }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        body { background-color: #212121; color: #ececec; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; height: 100dvh; display: flex; overflow: hidden; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #424242; border-radius: 3px; }
        .prose pre { background: #000000 !important; border: 1px solid #333; border-radius: 0.5rem; padding: 1rem; margin-top: 0.5rem; overflow-x: auto; }
        .prose code { font-family: 'Fira Code', monospace; font-size: 0.875rem; }
        .prose p { margin-bottom: 1rem; line-height: 1.6; }
        textarea { resize: none; overflow-y: hidden; }
        textarea:focus { outline: none; }
        .typing-loader { display: flex; gap: 4px; align-items: center; padding: 10px 0; }
        .typing-loader span { width: 6px; height: 6px; background-color: #888; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .typing-loader span:nth-child(1) { animation-delay: -0.32s; }
        .typing-loader span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body class="bg-gray800 text-gray-100 flex h-[100dvh] w-full selection:bg-blue-500/30 relative">

    <!-- 🔐 LOGIN MODAL -->
    <div id="authModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-gray900 border border-white/10 w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-6">
            <div class="text-center">
                <h2 id="modalTitle" class="text-xl font-bold">Access ApexNet</h2>
                <p id="modalSub" class="text-xs text-gray-400 mt-1">Enter your credentials to connect</p>
            </div>
            <div class="flex bg-gray800 p-1 rounded-lg border border-white/5 text-xs font-medium">
                <button onclick="switchTab('login')" id="tabLogin" class="flex-1 py-2 rounded-md bg-blue-600 text-white transition-all">Login</button>
                <button onclick="switchTab('signup')" id="tabSignup" class="flex-1 py-2 rounded-md text-gray-400 hover:text-white transition-all">Signup</button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="text-xs text-gray-400 block mb-1">Username</label>
                    <input type="text" id="authUsername" value="Ayushpandey_Boss" class="w-full bg-gray800 border border-white/10 rounded-lg px-3 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="text-xs text-gray-400 block mb-1">Password</label>
                    <input type="password" id="authPassword" value="123456789@1234" class="w-full bg-gray800 border border-white/10 rounded-lg px-3 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <div id="signupKeyBox" class="hidden">
                    <label class="text-xs text-gray-400 block mb-1">Activation Key</label>
                    <input type="text" id="authKey" placeholder="APEX-ADMIN-9999" class="w-full bg-gray800 border border-white/10 rounded-lg px-3 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <p id="authError" class="text-xs text-red-400 text-center hidden"></p>
                <button onclick="handleAuthSubmit()" id="authSubmitBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-lg transition-colors text-sm">Authenticate</button>
            </div>
        </div>
    </div>

    <!-- Sidebar -->
    <aside class="w-[260px] bg-gray900 flex-shrink-0 flex flex-col hidden md:flex border-r border-white/5">
        <div class="p-3">
            <button onclick="createNewChat()" class="w-full flex items-center gap-3 px-3 py-3 rounded-md hover:bg-white/5 border border-white/10 transition-colors text-sm font-medium">
                <i class="ph ph-plus text-lg"></i> New Chat
            </button>
        </div>
        <div class="flex-1 overflow-y-auto p-3 space-y-1" id="historyList"></div>
        <div class="p-4 border-t border-white/5 flex items-center justify-between text-xs text-gray-400">
            <div class="flex items-center gap-2">
                <div id="statusDot" class="w-2 h-2 rounded-full bg-yellow-500"></div>
                <span id="serverStatus">Connecting...</span>
            </div>
            <button onclick="logout()" title="Logout" class="hover:text-red-400 transition-colors text-sm"><i class="ph ph-sign-out"></i></button>
        </div>
    </aside>

    <!-- Main Chat Content -->
    <main class="flex-1 flex flex-col h-full w-full overflow-hidden relative">
        <header class="md:hidden flex items-center justify-between p-3 border-b border-white/10 bg-gray900 text-white flex-shrink-0">
            <button onclick="document.querySelector('aside').classList.toggle('hidden')"><i class="ph ph-list text-2xl"></i></button>
            <h1 class="font-medium text-sm">ApexNet</h1>
            <div class="flex items-center gap-3">
                <i class="ph ph-sign-out text-lg cursor-pointer text-red-400" onclick="logout()"></i>
                <i class="ph ph-plus text-xl cursor-pointer" onclick="createNewChat()"></i>
            </div>
        </header>

        <div id="chatBox" class="flex-1 overflow-y-auto p-4 md:p-6 w-full">
            <div class="h-full flex flex-col items-center justify-center text-center px-4" id="welcomeScreen">
                <div class="w-16 h-16 bg-white/10 rounded-full flex items-center justify-center mb-6 shadow-lg">
                    <i class="ph ph-terminal-window text-3xl text-gray-300"></i>
                </div>
                <h2 class="text-2xl font-semibold mb-2">ApexNet 7.6B Engine</h2>
                <p class="text-gray-400 text-sm max-w-md">Fetching live endpoint from Gist & verifying session...</p>
            </div>
        </div>

        <div class="flex-shrink-0 w-full bg-gray800 pt-2 pb-4 px-3 md:px-8 border-t border-white/5">
            <div class="max-w-3xl mx-auto relative flex items-end bg-gray700 border border-white/10 rounded-xl overflow-hidden shadow-2xl focus-within:border-gray-500 transition-colors">
                <textarea id="userInput" rows="1" class="w-full max-h-[150px] bg-transparent py-3 pl-4 pr-12 text-sm text-gray-100 placeholder-gray-400" placeholder="Message ApexNet..."></textarea>
                <button id="sendBtn" onclick="handleSend()" class="absolute right-3 bottom-2.5 p-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-md transition-colors">
                    <i class="ph ph-paper-plane-right text-lg"></i>
                </button>
            </div>
            <div class="text-center mt-1.5 text-[10px] text-gray-500">ApexNet Mobile Console v2.1 • Bug-Free Edition</div>
        </div>
    </main>

    <script>
        const GIST_URL = "https://gist.githubusercontent.com/PandeyJI-9/6b0c7fa3c4ed32c7d6da9681876fb80f/raw/colab_link.txt";
        let COLAB_URL = "";
        let AUTH_TOKEN = localStorage.getItem('apex_token') || "";
        
        let currentMode = 'login';
        let currentChatId = null;
        let chats = JSON.parse(localStorage.getItem('apex_chats_pro')) || [];

        async function initSystem() {
            try {
                const cacheBuster = new Date().getTime(); 
                const linkRes = await fetch(`${GIST_URL}?t=${cacheBuster}`);
                COLAB_URL = (await linkRes.text()).trim().replace(/\/$/, "");
                
                document.getElementById('serverStatus').innerText = 'System Online';
                document.getElementById('statusDot').className = 'w-2 h-2 rounded-full bg-green-500';

                if (!AUTH_TOKEN) {
                    document.getElementById('authModal').classList.remove('hidden');
                } else {
                    verifyToken();
                }
            } catch (err) {
                document.getElementById('serverStatus').innerText = 'Offline';
                document.getElementById('statusDot').className = 'w-2 h-2 rounded-full bg-red-500';
            }
        }

        function switchTab(mode) {
            currentMode = mode;
            document.getElementById('tabLogin').className = mode === 'login' ? "flex-1 py-2 rounded-md bg-blue-600 text-white transition-all" : "flex-1 py-2 rounded-md text-gray-400 hover:text-white transition-all";
            document.getElementById('tabSignup').className = mode === 'signup' ? "flex-1 py-2 rounded-md bg-blue-600 text-white transition-all" : "flex-1 py-2 rounded-md text-gray-400 hover:text-white transition-all";
            document.getElementById('signupKeyBox').classList.toggle('hidden', mode === 'login');
            document.getElementById('authSubmitBtn').innerText = mode === 'login' ? "Authenticate" : "Create Account";
        }

        async function handleAuthSubmit() {
            const username = document.getElementById('authUsername').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            const key = document.getElementById('authKey').value.trim();
            const errBox = document.getElementById('authError');

            if (!username || !password) return errBox.classList.remove('hidden'), errBox.innerText = "Fill all fields";

            try {
                let endpoint = currentMode === 'login' ? '/v1/auth/login' : '/v1/auth/signup';
                let payload = currentMode === 'login' ? { username, password } : { username, password, activation_key: key };

                const res = await fetch(`${COLAB_URL}${endpoint}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });

                if (res.ok) {
                    const data = await res.json();
                    AUTH_TOKEN = data.token;
                    localStorage.setItem('apex_token', AUTH_TOKEN);
                    document.getElementById('authModal').classList.add('hidden');
                    errBox.classList.add('hidden');
                    verifyToken();
                } else {
                    const errData = await res.json();
                    errBox.innerText = errData.detail || "Auth Failed";
                    errBox.classList.remove('hidden');
                }
            } catch (err) {
                errBox.innerText = "Server error. Is Colab running?";
                errBox.classList.remove('hidden');
            }
        }

        function verifyToken() {
            document.getElementById('authModal').classList.add('hidden');
            let welcome = document.getElementById('welcomeScreen');
            if (welcome) {
                welcome.innerHTML = `
                    <div class="w-16 h-16 bg-blue-600/20 rounded-full flex items-center justify-center mb-6"><i class="ph ph-check text-3xl text-blue-500"></i></div>
                    <h2 class="text-2xl font-semibold mb-2">System Ready</h2>
                    <p class="text-gray-400 text-sm">Session verified successfully. Start chatting below.</p>`;
            }
        }

        function logout() {
            localStorage.removeItem('apex_token');
            AUTH_TOKEN = "";
            document.getElementById('authModal').classList.remove('hidden');
        }

        function createNewChat() {
            currentChatId = Date.now().toString();
            chats.unshift({ id: currentChatId, title: "New Conversation", messages: [] });
            saveChats();
            document.getElementById('chatBox').innerHTML = ''; 
        }

        function loadChat(id) {
            currentChatId = id;
            document.getElementById('chatBox').innerHTML = '';
            const chat = chats.find(c => c.id === id);
            if (chat) chat.messages.forEach(msg => appendMessage(msg.role, msg.content, false));
        }

        function saveChats() { localStorage.setItem('apex_chats_pro', JSON.stringify(chats)); renderHistory(); }

        function renderHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = '';
            chats.forEach(chat => {
                const isActive = chat.id === currentChatId;
                list.innerHTML += `<button onclick="loadChat('${chat.id}')" class="w-full text-left flex items-center gap-3 px-3 py-2 rounded-md ${isActive ? 'bg-white/10 text-white' : 'text-gray-400 hover:bg-white/5'} transition-colors text-sm truncate"><i class="ph ph-chat-teardrop text-lg flex-shrink-0"></i><span class="truncate">${chat.title}</span></button>`;
            });
        }

        function appendMessage(role, text, save = true) {
            const chatBox = document.getElementById('chatBox');
            // 🔥 BUG FIXED HERE: Removed the typo ']' 
            const welcome = document.getElementById('welcomeScreen');
            if (welcome) welcome.remove();

            const isUser = role === 'user';
            const msgDiv = document.createElement('div');
            msgDiv.className = `w-full flex justify-center py-6 ${isUser ? 'bg-transparent' : 'bg-gray800 border-y border-white/5'}`;
            msgDiv.innerHTML = `
                <div class="max-w-3xl w-full px-4 flex gap-4 md:gap-6">
                    <div class="w-8 h-8 rounded-sm flex-shrink-0 flex items-center justify-center ${isUser ? 'bg-blue-600' : 'bg-green-600'}"><i class="${isUser ? 'ph ph-user' : 'ph ph-robot'} text-white"></i></div>
                    <div class="prose prose-invert max-w-none text-sm md:text-base text-gray-200 w-full overflow-hidden">${isUser ? text : marked.parse(text)}</div>
                </div>`;
            chatBox.appendChild(msgDiv);
            document.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
            chatBox.scrollTop = chatBox.scrollHeight;

            if (save && currentChatId) {
                const chat = chats.find(c => c.id === currentChatId);
                if (chat) {
                    if (chat.messages.length === 0 && isUser) chat.title = text.substring(0, 30) + "...";
                    chat.messages.push({ role, content: text });
                    saveChats();
                }
            }
        }

        function showTyping() {
            const chatBox = document.getElementById('chatBox');
            const typingDiv = document.createElement('div');
            typingDiv.id = 'typingIndicator';
            typingDiv.className = 'w-full flex justify-center py-6 bg-gray800 border-y border-white/5';
            typingDiv.innerHTML = `<div class="max-w-3xl w-full px-4 flex gap-4 md:gap-6"><div class="w-8 h-8 rounded-sm flex-shrink-0 flex items-center justify-center bg-green-600"><i class="ph ph-robot text-white"></i></div><div class="typing-loader"><span></span><span></span><span></span></div></div>`;
            chatBox.appendChild(typingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function handleSend() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            if (!currentChatId) createNewChat();
            appendMessage('user', text);
            input.value = ''; input.style.height = 'auto';
            showTyping();

            if (!AUTH_TOKEN) {
                document.getElementById('typingIndicator').remove();
                document.getElementById('authModal').classList.remove('hidden');
                return;
            }

            try {
                const res = await fetch(`${COLAB_URL}/v1/chat`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${AUTH_TOKEN}` }, body: JSON.stringify({ message: text }) });
                document.getElementById('typingIndicator').remove();
                
                if (res.status === 401) { logout(); appendMessage('ai', "⚠️ Session expired. Please login again."); return; }
                if (res.ok) { const data = await res.json(); appendMessage('ai', data.reply); } 
                else { appendMessage('ai', `⚠️ HTTP Error: ${res.status}`); }
            } catch (err) {
                document.getElementById('typingIndicator').remove();
                appendMessage('ai', `🚨 Tunnel disconnected. Is your Colab session active?`);
            }
        }

        const input = document.getElementById('userInput');
        input.addEventListener('input', function() { this.style.height = 'auto'; this.style.height = this.scrollHeight + 'px'; });
        input.addEventListener('keydown', function(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); } });

        if (chats.length === 0) createNewChat(); else loadChat(chats[0].id);
        renderHistory();
        initSystem();
    </script>
</body>
</html>
