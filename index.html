<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ApexNet v7.0 | Premium Core</title>
    
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { apexDark: '#030712', apexGlass: 'rgba(255, 255, 255, 0.03)', apexBorder: 'rgba(255, 255, 255, 0.1)' } } } }
    </script>
    
    <!-- Cloud & Parser Implants -->
    <script src="https://js.puter.com/v2/"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- PDF.js Implant -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;600&family=Inter:wght@300;400;600;800&display=swap');
        body { background-color: #030712; color: #e5e7eb; font-family: 'Inter', sans-serif; margin: 0; height: 100dvh; display: flex; overflow: hidden; }
        ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: #374151; border-radius: 10px; }
        .prose pre { background: rgba(0,0,0,0.5) !important; border: 1px solid rgba(255,255,255,0.1); border-radius: 0.75rem; backdrop-filter: blur(10px); }
        .glass-panel { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .neon-glow:focus-within { box-shadow: 0 0 20px rgba(59, 130, 246, 0.2); border-color: rgba(59, 130, 246, 0.5); }
        .terminal-text { font-family: 'Fira Code', monospace; }
        textarea { resize: none; overflow-y: hidden; } textarea:focus { outline: none; }
        details.think-block summary::-webkit-details-marker { display: none; }
        
        /* Matrix Background Animation */
        .cyber-grid { background-size: 40px 40px; background-image: linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px); }
    </style>
</head>
<body class="cyber-grid flex h-[100dvh] w-full selection:bg-blue-600/30">

    <!-- 0. MATRIX BOOT SEQUENCE -->
    <div id="bootScreen" class="fixed inset-0 bg-black z-[100] flex flex-col items-start justify-center p-8 sm:p-20 terminal-text text-green-500 text-xs sm:text-sm overflow-hidden">
        <div id="bootLines" class="flex flex-col gap-1 w-full max-w-2xl"></div>
    </div>

    <!-- 1. AUTH MODAL (Premium Glassmorphism + Google) -->
    <div id="authModal" class="fixed inset-0 bg-[#030712]/90 backdrop-blur-3xl z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-panel w-full max-w-sm rounded-3xl p-8 text-center shadow-[0_0_80px_-15px_rgba(59,130,246,0.2)] relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-blue-500 to-transparent opacity-50"></div>
            <i class="ph ph-fingerprint text-6xl text-blue-500 mb-4 drop-shadow-[0_0_15px_rgba(59,130,246,0.6)] animate-pulse"></i>
            <h2 class="text-3xl font-extrabold text-white mb-2 tracking-tight">ApexNet <span class="text-blue-500">v7</span></h2>
            <p class="text-[10px] text-gray-400 mb-8 uppercase tracking-[0.3em]">Neural Interface Access</p>
            
            <div class="flex flex-col gap-3">
                <button onclick="loginWithPuter()" class="w-full bg-blue-600/90 hover:bg-blue-500 text-white text-sm font-bold tracking-widest uppercase py-3.5 rounded-xl transition-all shadow-[0_0_20px_rgba(37,99,235,0.3)] flex items-center justify-center gap-2">
                    <i class="ph ph-cloud-check text-lg"></i> Access via Puter
                </button>
                <button onclick="alert('Google Auth API linking in progress... Please use Puter for Cloud DB.')" class="w-full bg-white/5 hover:bg-white/10 text-white text-sm border border-white/10 font-bold py-3.5 rounded-xl transition-all flex items-center justify-center gap-2">
                    <i class="ph ph-google-logo text-lg text-red-400"></i> Continue with Google
                </button>
            </div>
        </div>
    </div>

    <!-- Sidebar -->
    <aside class="w-[280px] glass-panel flex-shrink-0 flex flex-col hidden md:flex border-r border-white/5 shadow-2xl z-10">
        <div class="p-5 border-b border-white/5"><button onclick="createNewChat()" class="w-full flex items-center justify-center gap-3 px-4 py-3.5 rounded-xl bg-blue-600/10 text-sm font-bold text-blue-400 hover:bg-blue-600/20 border border-blue-500/20 transition-all shadow-[0_0_15px_rgba(37,99,235,0.1)]"><i class="ph ph-plus-circle text-lg"></i> New Terminal</button></div>
        <div class="flex-1 overflow-y-auto px-4 py-3 space-y-2" id="historyList"></div>
        <div class="p-5 border-t border-white/5 flex flex-col gap-3 text-xs bg-black/20">
            <div class="flex items-center justify-between text-gray-400">
                <div class="flex items-center gap-2"><div id="statusDot" class="w-2 h-2 rounded-full bg-red-500 shadow-[0_0_10px_rgba(239,68,68,0.8)]"></div><span id="colabStatus" class="tracking-widest uppercase text-[9px]">Offline</span></div>
                <button onclick="logoutPuter()" class="hover:text-red-500"><i class="ph ph-power text-lg"></i></button>
            </div>
            <div class="text-[10px] text-blue-400 truncate terminal-text" id="puterUserName">Agent: Unknown</div>
        </div>
    </aside>

    <!-- Main Interface -->
    <main class="flex-1 flex flex-col h-full w-full overflow-hidden relative z-10">
        <header class="md:hidden flex items-center justify-between p-4 glass-panel text-white shadow-md">
            <button onclick="document.querySelector('aside').classList.toggle('hidden')"><i class="ph ph-list text-2xl text-blue-400"></i></button>
            <h1 class="font-bold text-xs tracking-widest uppercase text-blue-500 drop-shadow-[0_0_5px_rgba(59,130,246,0.5)]">ApexNet 7.0</h1>
            <i class="ph ph-plus-circle text-2xl text-blue-400" onclick="createNewChat()"></i>
        </header>

        <div id="chatBox" class="flex-1 overflow-y-auto p-4 md:p-8 w-full max-w-5xl mx-auto flex flex-col gap-6 scroll-smooth"></div>

        <!-- The Floating Command Palette -->
        <div class="flex-shrink-0 w-full bg-gradient-to-t from-[#030712] via-[#030712] to-transparent pb-6 pt-2 px-4 md:px-8 relative">
            <div class="max-w-4xl mx-auto">
                <div id="attachmentPreview" class="hidden mb-2 inline-flex items-center gap-2 bg-blue-900/20 border border-blue-500/30 px-3 py-1.5 rounded-lg text-xs text-blue-300 backdrop-blur-md shadow-[0_0_15px_rgba(37,99,235,0.15)]">
                    <i id="attachIcon" class="ph ph-file-text"></i><span id="attachName" class="max-w-[150px] truncate">file.pdf</span>
                    <button onclick="clearAttachment()" class="text-red-400 hover:text-red-300 ml-2"><i class="ph ph-x-circle"></i></button>
                </div>

                <div class="flex flex-col glass-panel rounded-2xl p-2 shadow-2xl neon-glow transition-all">
                    <div class="flex items-center justify-between px-3 pt-2 pb-1 border-b border-white/5 mb-1">
                        <button id="ragBtn" onclick="toggleRAG()" class="text-[9px] font-bold uppercase tracking-[0.2em] bg-purple-900/20 text-purple-400 px-3 py-1.5 rounded-full transition-all flex items-center gap-1.5"><i class="ph ph-books text-sm"></i> Vault: OFF</button>
                        <input type="text" id="manualColabUrl" placeholder="Colab URL..." class="bg-black/30 border border-white/10 rounded-md px-3 py-1.5 text-[10px] text-gray-300 w-32 focus:w-56 transition-all terminal-text focus:outline-none focus:border-blue-500/50">
                    </div>
                    <div class="relative flex items-end w-full">
                        <input type="file" id="fileUpload" class="hidden" accept="image/*,.pdf" onchange="handleFileSelect(event)">
                        <button onclick="document.getElementById('fileUpload').click()" class="p-3 text-gray-500 hover:text-blue-400 transition-all"><i class="ph ph-paperclip text-xl"></i></button>
                        <textarea id="userInput" rows="1" class="w-full max-h-[150px] bg-transparent py-3 px-2 text-sm text-gray-100 placeholder-gray-600 focus:outline-none" placeholder="Enter command, /scan URL, or /imagine..."></textarea>
                        <button id="sendBtn" onclick="handleSend()" class="p-3 bg-blue-600/90 text-white rounded-xl shadow-[0_0_20px_rgba(37,99,235,0.5)] ml-2 mb-1 mr-1 hover:bg-blue-500 transition-all"><i class="ph ph-paper-plane-tilt text-lg font-bold"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        let currentUser = null, chats = [], currentChatId = null, isGenerating = false, isRAGEnabled = false;
        let currentAttachment = { type: null, data: null, name: null };

        // --- 0. MATRIX BOOT SEQUENCE LOGIC ---
        async function runBootSequence() {
            const lines = [
                "> SYSTEM STARTUP INITIATED...",
                "> KERNEL v7.0.1 LOADED.",
                "> ESTABLISHING NEURAL LINK...",
                "> CONNECTING TO OMNI-VAULT...",
                "> BYPASSING SECURITY PROTOCOLS... SUCCESS.",
                "> APEXNET IS ONLINE."
            ];
            const bootLinesDiv = document.getElementById('bootLines');
            for (let i = 0; i < lines.length; i++) {
                const p = document.createElement('p');
                p.innerText = lines[i];
                bootLinesDiv.appendChild(p);
                await new Promise(r => setTimeout(r, 200 + Math.random() * 300));
            }
            await new Promise(r => setTimeout(r, 600));
            document.getElementById('bootScreen').classList.add('hidden');
            checkPuterStatus();
        }

        // --- 1. AUTH & CLOUD ---
        async function checkPuterStatus() {
            if (puter.auth.isSignedIn()) {
                currentUser = await puter.auth.getUser();
                document.getElementById('puterUserName').innerText = `Agent: ${currentUser.username}`;
                document.getElementById('authModal').classList.add('hidden');
                loadCloudData();
            } else {
                document.getElementById('authModal').classList.remove('hidden');
            }
        }
        async function loginWithPuter() { await puter.auth.signIn(); window.location.reload(); }
        async function logoutPuter() { await puter.auth.signOut(); window.location.reload(); }

        async function loadCloudData() {
            const stored = await puter.kv.get("apex_chats");
            if (stored) chats = JSON.parse(stored);
            if (chats.length > 0) loadChat(chats[0].id); else createNewChat();
            renderHistory();
        }
        async function saveCloudData() { if (currentUser) await puter.kv.set("apex_chats", JSON.stringify(chats)); }

        // --- 2. UI LOGIC ---
        function toggleRAG() {
            isRAGEnabled = !isRAGEnabled;
            const btn = document.getElementById('ragBtn');
            btn.innerHTML = isRAGEnabled ? '<i class="ph ph-books text-sm"></i> Vault: ON' : '<i class="ph ph-books text-sm"></i> Vault: OFF';
            btn.className = isRAGEnabled ? "text-[9px] font-bold uppercase tracking-[0.2em] bg-purple-600/30 text-purple-300 border border-purple-500/50 px-3 py-1.5 rounded-full shadow-[0_0_15px_rgba(168,85,247,0.3)] transition-all flex items-center gap-1.5" : "text-[9px] font-bold uppercase tracking-[0.2em] bg-purple-900/20 text-purple-400 px-3 py-1.5 rounded-full transition-all flex items-center gap-1.5";
        }

        async function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('attachmentPreview').classList.remove('hidden');
            document.getElementById('attachName').innerText = "Processing...";
            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (e) => { currentAttachment = { type: 'image', data: e.target.result, name: file.name }; document.getElementById('attachIcon').className = "ph ph-image"; document.getElementById('attachName').innerText = file.name; };
                reader.readAsDataURL(file);
            } else if (file.type === 'application/pdf') {
                try {
                    const pdf = await pdfjsLib.getDocument(await file.arrayBuffer()).promise;
                    let text = `--- PDF: ${file.name} ---\n`;
                    for (let i = 1; i <= Math.min(pdf.numPages, 10); i++) {
                        const page = await pdf.getPage(i);
                        text += (await page.getTextContent()).items.map(i => i.str).join(' ') + "\n";
                    }
                    currentAttachment = { type: 'pdf', data: text, name: file.name };
                    document.getElementById('attachIcon').className = "ph ph-file-pdf"; document.getElementById('attachName').innerText = file.name;
                } catch (err) { alert("PDF Error!"); clearAttachment(); }
            }
        }
        function clearAttachment() { currentAttachment = { type: null, data: null, name: null }; document.getElementById('fileUpload').value = ''; document.getElementById('attachmentPreview').classList.add('hidden'); }

        async function createNewChat() {
            if (isGenerating) return;
            currentChatId = 'chat_' + Date.now();
            chats.unshift({ id: currentChatId, title: "New Terminal", messages: [] });
            document.getElementById('chatBox').innerHTML = `<div class="h-full flex flex-col items-center justify-center opacity-40"><i class="ph ph-cpu text-6xl text-blue-500 mb-4 drop-shadow-[0_0_20px_rgba(59,130,246,0.8)]"></i><h2 class="text-xl font-bold tracking-[0.3em] uppercase terminal-text">Omni-Core Ready</h2></div>`;
            renderHistory(); await saveCloudData();
        }

        function loadChat(id) {
            if (isGenerating) return; currentChatId = id;
            document.getElementById('chatBox').innerHTML = '';
            chats.find(c => c.id === id).messages.forEach(msg => appendMessageUI(msg.role, msg.content, msg.attachment));
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('historyList'); list.innerHTML = '';
            chats.forEach(chat => {
                const isActive = chat.id === currentChatId;
                list.innerHTML += `<button onclick="loadChat('${chat.id}')" class="w-full text-left flex items-center gap-3 px-4 py-3 rounded-xl ${isActive ? 'bg-blue-600/20 border border-blue-500/30 text-blue-300' : 'text-gray-400 hover:bg-white/5 border border-transparent'} transition-all text-sm truncate"><i class="ph ph-terminal-window"></i><span class="truncate">${chat.title}</span></button>`;
            });
        }

        function appendMessageUI(role, text, attachData = null) {
            const chatBox = document.getElementById('chatBox'); const msgRow = document.createElement('div');
            msgRow.className = `w-full flex my-4 px-2 ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            
            // 🧠 THE PREMIUM DEEP THINK STYLING
            let formattedText = text;
            formattedText = formattedText.replace(/<think>/g, '<details class="think-block mb-4 glass-panel border border-green-500/20 rounded-xl p-3 shadow-[0_0_15px_rgba(34,197,94,0.1)]"><summary class="cursor-pointer text-xs terminal-text font-bold text-green-400 flex items-center gap-2 select-none"><i class="ph ph-terminal-window text-lg animate-pulse"></i> [SYSTEM.DEEP_THINK_PROTOCOL]</summary><div class="mt-3 text-xs text-gray-400 terminal-text border-l-2 border-green-500/30 pl-3">');
            formattedText = formattedText.replace(/<\/think>/g, '</div></details>');

            if (role === 'user') {
                let attachHtml = '';
                if (attachData?.type === 'image') attachHtml = `<img src="${attachData.data}" class="w-48 rounded-lg mb-2 border border-white/20">`;
                else if (attachData?.type === 'pdf') attachHtml = `<div class="bg-black/30 p-2 rounded mb-2 text-xs border border-white/10"><i class="ph ph-file-pdf"></i> ${attachData.name}</div>`;
                msgRow.innerHTML = `<div class="max-w-[85%] bg-blue-600/90 text-white px-5 py-3 rounded-2xl rounded-tr-sm text-sm shadow-[0_0_15px_rgba(37,99,235,0.3)]">${attachHtml}${formattedText}</div>`;
            } else {
                msgRow.innerHTML = `<div class="max-w-[95%] glass-panel px-5 py-4 rounded-2xl rounded-tl-sm text-sm text-gray-200 shadow-xl prose prose-invert overflow-x-auto w-full">${marked.parse(formattedText)}</div>`;
            }
            chatBox.appendChild(msgRow);
            document.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        const inputElem = document.getElementById('userInput');
        inputElem.addEventListener('input', function() { this.style.height = 'auto'; this.style.height = this.scrollHeight + 'px'; });
        inputElem.addEventListener('keydown', function(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }});

        async function handleSend() {
            if (isGenerating) return;
            const text = inputElem.value.trim(); const colabUrl = document.getElementById('manualColabUrl').value.trim().replace(/\/$/, "");
            if (!text && !currentAttachment.data) return;

            if (text.startsWith("/imagine ")) {
                isGenerating = true; const prompt = text.replace("/imagine ", "");
                appendMessageUI('user', text); inputElem.value = '';
                const uniqueId = 'stream_' + Date.now();
                document.getElementById('chatBox').insertAdjacentHTML('beforeend', `<div class="w-full flex my-4 px-2 justify-start"><div class="glass-panel p-5 rounded-2xl"><div id="status_${uniqueId}" class="text-xs text-blue-400 animate-pulse terminal-text"><i class="ph ph-palette"></i> SYNTHESIZING VISUAL DATA...</div><div id="${uniqueId}"></div></div></div>`);
                try {
                    const imgElement = await puter.ai.txt2img(prompt);
                    document.getElementById(`status_${uniqueId}`).classList.add('hidden');
                    document.getElementById(uniqueId).appendChild(imgElement); imgElement.className = "rounded-lg shadow-lg border border-white/10";
                    chats.find(c => c.id === currentChatId).messages.push({ role: 'user', content: text }, { role: 'assistant', content: `[Image Generated]` }); await saveCloudData();
                } catch(e) {}
                isGenerating = false; clearAttachment(); return;
            }
            if (!colabUrl) { alert("INITIALIZE BACKEND URL FIRST."); return; }

            isGenerating = true; appendMessageUI('user', text, currentAttachment); inputElem.value = ''; inputElem.style.height = 'auto';
            const chat = chats.find(c => c.id === currentChatId);
            if (chat.messages.length === 0) chat.title = text.substring(0, 20) || currentAttachment.name;
            
            let finalPrompt = text;
            if (currentAttachment.type === 'pdf') finalPrompt = `${text}\n\n${currentAttachment.data}`; 
            else if (text.startsWith("/scan ")) finalPrompt = `[SYSTEM_CMD: SCAN_URL] ${text.replace("/scan ", "")}`;
            const payload = { role: 'user', content: finalPrompt };
            if (currentAttachment.type === 'image') payload.image_base64 = currentAttachment.data;
            chat.messages.push({ role: 'user', content: text, attachment: currentAttachment.type ? currentAttachment : null });
            clearAttachment();

            const uniqueId = 'stream_' + Date.now();
            document.getElementById('chatBox').insertAdjacentHTML('beforeend', `<div class="w-full flex my-4 px-2 justify-start"><div class="w-full max-w-[95%] glass-panel px-5 py-4 rounded-2xl rounded-tl-sm text-sm text-gray-200 prose prose-invert overflow-x-auto"><div id="status_${uniqueId}" class="text-xs font-bold text-blue-400 mb-2 animate-pulse terminal-text">[+] LINKING TO APEXNET CORE...</div><div id="${uniqueId}"></div></div></div>`);
            const contentElem = document.getElementById(uniqueId); const statusElem = document.getElementById(`status_${uniqueId}`);
            let fullReply = "";

            try {
                const messagesToSend = [...chat.messages]; messagesToSend[messagesToSend.length - 1] = payload;
                const response = await fetch(`${colabUrl}/v1/chat`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Bypass-Tunnel-Reminder': 'true' }, body: JSON.stringify({ messages: messagesToSend, use_omni_vault: isRAGEnabled }) });
                if (!response.ok) throw new Error("Offline");
                
                document.getElementById('statusDot').className = 'w-2 h-2 rounded-full bg-green-500 shadow-[0_0_10px_rgba(34,197,94,0.8)]'; document.getElementById('colabStatus').innerText = 'Online';

                const reader = response.body.getReader(); const decoder = new TextDecoder();
                while (true) {
                    const { value, done } = await reader.read(); if (done) break;
                    const lines = decoder.decode(value, { stream: true }).split("\n");
                    for (let line of lines) {
                        if (line.startsWith("data: ")) {
                            const dataStr = line.replace("data: ", "").trim(); if (dataStr === "[DONE]") break;
                            try {
                                const parsed = JSON.parse(dataStr);
                                if (parsed.status) { if (parsed.status === "DONE") statusElem.classList.add('hidden'); else statusElem.innerText = parsed.status; }
                                if (parsed.content) {
                                    fullReply += parsed.content;
                                    let displayReply = fullReply.replace(/<think>/g, '<details open class="think-block mb-4 glass-panel border border-green-500/20 rounded-xl p-3 shadow-[0_0_15px_rgba(34,197,94,0.1)]"><summary class="cursor-pointer text-xs terminal-text font-bold text-green-400 flex items-center gap-2 select-none"><i class="ph ph-terminal-window text-lg animate-pulse"></i> [SYSTEM.DEEP_THINK_PROTOCOL]</summary><div class="mt-3 text-xs text-gray-400 terminal-text border-l-2 border-green-500/30 pl-3">');
                                    displayReply = displayReply.replace(/<\/think>/g, '</div></details>');
                                    contentElem.innerHTML = marked.parse(displayReply);
                                    document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
                                }
                            } catch (e) {}
                        }
                    }
                }
                document.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el)); chat.messages.push({ role: 'assistant', content: fullReply }); await saveCloudData();
            } catch (err) {
                statusElem.classList.add('hidden'); contentElem.innerHTML = `<span class='text-red-400 font-bold terminal-text'>🚨 CORE_LINK_FAILED</span>`;
                document.getElementById('statusDot').className = 'w-2 h-2 rounded-full bg-red-500 shadow-[0_0_10px_rgba(239,68,68,0.8)]'; document.getElementById('colabStatus').innerText = 'Offline';
            } finally { isGenerating = false; }
        }

        // STARTUP
        window.onload = runBootSequence;
    </script>
</body>
</html>
